          ${shown.map(t => { const isIn = t.type === 'income'; return `<tr class="tx-click" data-edit="${esc(t.id)}"><td class="num" style="white-space:nowrap">${fmtDate(t.date)}</td><td><b style="font-weight:500">${esc(t.party)}</b>${t.note ? `<div class="small muted">${esc(t.note)}</div>` : ''}${t.fileId ? ' <span class="chip">receipt</span>' : ''}</td><td>${t.type === 'saving' ? 'Savings' + (t.goalId ? ' · ' + esc((D.goals.find(g => g.id === t.goalId) || {}).name || '') : '') : `<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${t.type === 'expense' ? catColor(t.categoryId) : '#9bd85a'};margin-right:6px"></span>${esc(Calc.cat(t.categoryId).name)}`}</td><td class="muted">${esc(Calc.acct(t.accountId).name)}</td>
            <td>${t.status === 'pending' ? `<span class="chip warn">Pending</span> <button class="btn lime sm" data-ok="${esc(t.id)}" style="padding:4px 10px">Confirm</button>` : '<span class="chip pos">Cleared</span>'}</td><td class="r num ${isIn ? 'pos' : t.type === 'saving' ? '' : 'neg'}" style="font-weight:500">${money(isIn ? t.amount : -t.amount, { sign: true })}</td></tr>`; }).join('')}
          ${!list.length ? `<tr><td colspan="6">${Frag.empty(D.tx.length ? 'No matches' : 'No transactions yet', D.tx.length ? 'Try clearing a filter.' : 'Record a payment or import a CSV from your bank.')}</td></tr>` : ''}
        </tbody>${list.length ? `<tfoot><tr><td colspan="3">${list.length} transaction${list.length === 1 ? '' : 's'} · cleared only</td><td colspan="2" class="r"><span class="pos">+${money(tin)}</span> · <span class="neg">−${money(tout)}</span></td><td class="r num">${money(tin - tout, { sign: true })}</td></tr></tfoot>` : ''}</table></div>
        ${list.length > shown.length ? `<div style="text-align:center;margin-top:12px"><button class="btn soft" id="mMore">Show ${Math.min(150, list.length - shown.length)} more</button></div>` : ''}
      </section>`;
  },
  _money() {
    const f = Views.mf;
    $('#mq').oninput = e => { f.q = e.target.value; App.render(); };
    [['#mMonth', 'month'], ['#mType', 'type'], ['#mStatus', 'status'], ['#mCat', 'cat']].forEach(([s, k]) => $(s).onchange = e => { f[k] = e.target.value; f.limit = 150; App.render(); });
    $$('[data-a]').forEach(b => b.onclick = () => { f.acct = b.dataset.a; App.render(); });
    $$('.acct-chip[data-a]').forEach(b => { const a = D.accounts.find(x => x.id === b.dataset.a); if (a) b.ondblclick = () => Forms.account(a); });
    $('#addAcct').onclick = () => Forms.account();
    $('#mNew').onclick = () => Forms.tx({ type: 'expense' });
    $('#mImport').onclick = () => Forms.importCSV();
    $('#mExport').onclick = () => Reports.exportTx();
    const mm = $('#mMore'); if (mm) mm.onclick = () => { f.limit += 150; App.render(); };
    $$('tr[data-edit]').forEach(r => r.onclick = e => { if (e.target.closest('[data-ok]')) return; const t = Store.get('tx', r.dataset.edit); t && Forms.tx({ tx: t }); });
    $$('[data-ok]').forEach(b => b.onclick = e => { e.stopPropagation(); const t = Store.get('tx', b.dataset.ok); t && Forms.confirmTx(t, true); });
  },

  /* ================= TARGETS ================= */
  targets() {
    const biz = Calc.biz(), ym = thisMonth(), tg = Calc.target(ym), bs = Calc.budgets(ym);
    const limitTotal = sum(bs, b => b.limit), limitSpent = sum(bs, b => Math.min(b.spent, b.limit) + Math.max(0, b.spent - b.limit));
    const gs = D.goals.map(g => ({ g, c: Calc.goal(g) })), gT = sum(gs, x => num(x.g.target)), gS = sum(gs, x => x.c.saved);
    const hist = Calc.months(6).map(m => ({ m, t: Calc.target(m) }));
    const fourth = biz ? (() => { const issued = D.invoices.filter(i => i.kind !== 'quote' && i.status !== 'void' && i.status !== 'draft'); const tot = sum(issued, i => Calc.inv(i).total), paid = sum(issued, i => Math.min(Calc.inv(i).paid, Calc.inv(i).total)); return Frag.stat('Invoice collection rate', tot ? Math.round(pct(paid, tot)) + '%' : '—', `${money(paid)} of ${money(tot)} collected`); })()
      : (() => { const ds = D.debts.map(d => Calc.debt(d)); const owed = sum(D.debts, d => d.owed); return Frag.stat('Debt repaid', owed ? Math.round(pct(sum(ds, d => d.paid), owed)) + '%' : '—', `${money(sum(ds, d => d.left))} still owed`); })();
    return `<div class="page-h"><div><h2>Targets</h2><p>How far you are from where you want to be — updated with every payment.</p></div><div style="display:flex;gap:8px"><button class="btn soft" id="tLimits">Spending limits</button><button class="btn" id="tGoal">${I.plus} New goal</button></div></div>
      <div class="grid g-4">
        ${Frag.stat(`${biz ? 'Revenue' : 'Income'} target · ${monthName(ym, 'short')}`, tg.target ? Math.round(tg.pct) + '%' : '—', tg.target ? `${money(tg.got)} of ${money(tg.target)}` : 'No target set')}
        ${Frag.stat('Spending limits used', limitTotal ? Math.round(pct(limitSpent, limitTotal)) + '%' : '—', limitTotal ? `${money(limitSpent)} of ${money(limitTotal)}` : 'No limits set', limitTotal && limitSpent > limitTotal ? 'neg' : '')}
        ${Frag.stat('Saved toward goals', gT ? Math.round(pct(gS, gT)) + '%' : '—', gT ? `${money(gS)} of ${money(gT)}` : 'No goals yet')}
        ${fourth}
      </div>
      <div class="grid g-2 section">
        <section class="card lime target-card"><svg class="star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5c.9 6.2 4.3 9.6 10.5 10.5-6.2.9-9.6 4.3-10.5 10.5-.9-6.2-4.3-9.6-10.5-10.5C7.7 11.1 11.1 7.7 12 1.5z"/></svg>
          <div class="card-h" style="position:relative;margin:0"><span class="tag">MONTHLY ${biz ? 'REVENUE' : 'INCOME'} <i>${I.target}</i></span><button class="btn sm" id="tEdit">${tg.target ? 'Edit' : 'Set target'}</button></div>
          ${tg.target ? `<div class="label" style="position:relative">${monthName(ym)} · day ${new Date().getDate()} of ${daysInMonth(ym)}</div><div class="big num" style="position:relative">${money(tg.got)}<span style="font-size:20px;opacity:.6">/ ${money(tg.target)}</span></div>
            <div class="track"><span style="width:${tg.pct}%"></span><i class="pace" style="left:${tg.pacePct}%"></i></div>
            <div class="kv" style="margin-top:16px;position:relative;color:var(--lime-ink)"><span style="color:inherit;opacity:.75">Still needed</span><b class="num">${money(tg.gap)}</b><span style="color:inherit;opacity:.75">Expected by today</span><b class="num">${money(tg.expected)}</b><span style="color:inherit;opacity:.75">Pace</span><b>${tg.got >= tg.target ? 'Target reached' : tg.ahead >= 0 ? money(tg.ahead) + ' ahead' : money(-tg.ahead) + ' behind'}</b>
              ${tg.gap > 0 && ym === thisMonth() ? `<span style="color:inherit;opacity:.75">Needed per remaining day</span><b class="num">${money(tg.gap / Math.max(1, daysInMonth(ym) - new Date().getDate() + 1))}</b>` : ''}</div>
            <div class="hist" title="Share of target reached each month">${hist.map(h => `<div>${monthName(h.m, 'short')}<b>${h.t.target ? Math.round(pct(h.t.got, h.t.target)) + '%' : '—'}</b></div>`).join('')}</div>`
            : `<p style="position:relative;color:var(--lime-ink)">Set a monthly ${biz ? 'revenue' : 'income'} target and Fundly will show live progress, whether you’re on pace, and how much you need per day to close the gap.</p>`}
        </section>
        <section class="card"><div class="card-h"><h3 class="card-t">Spending limits · ${monthName(ym)}</h3><button class="btn soft sm" id="tLimits2">Edit</button></div>
          ${bs.length ? bs.sort((a, b) => b.pct - a.pct).map(b => `<div class="prog"><div class="top"><b>${esc(b.c.name)}</b><span class="num small ${b.left < 0 ? 'neg' : ''}">${b.left < 0 ? money(-b.left) + ' over' : money(b.left) + ' left'}</span></div><div style="margin-top:8px">${Frag.progressBar(b.pct, b.pct > 100 ? 'over' : b.pct >= 85 ? 'near' : 'ok')}</div><div class="sub"><span>${money(b.spent)} of ${money(b.limit)}</span><span>${Math.round(b.pct)}%</span></div></div>`).join('')
            : Frag.empty('No limits set', 'Give categories a monthly limit and see them fill up as you spend.', '<button class="btn sm" id="tLimits3">Set limits</button>')}
        </section>
      </div>
      <section class="card section"><div class="card-h"><h3 class="card-t">Savings goals</h3></div>
        ${gs.length ? `<div class="grid g-3">${gs.map(({ g, c }) => `<div class="stat goal-card tx-click" data-goal="${esc(g.id)}" style="border:1px solid var(--line)"><div style="display:flex;gap:14px;align-items:center">${Chart.ring(c.pct, { color: c.pct >= 100 ? 'var(--pos)' : 'var(--forest)' })}<div style="min-width:0"><b style="font-size:17px;margin:0">${esc(g.name)}</b><small>${money(c.saved)} of ${money(g.target)}</small></div></div>
          <div class="small ${c.late ? 'warn' : 'muted'}">${c.pct >= 100 ? '✓ Goal reached' : c.late ? `Target date passed · ${money(c.left)} to go` : c.perMonth ? `Save ${money(c.perMonth)}/month for ${c.months} month${c.months > 1 ? 's' : ''} to reach it by ${fmtDate(g.date)}` : `${money(c.left)} to go`}</div>
          <div><button class="btn sm lime" data-add="${esc(g.id)}">${I.plus} Add money</button></div></div>`).join('')}</div>`
          : Frag.empty('No goals yet', biz ? 'Save toward tax, equipment or a cash buffer.' : 'Emergency fund, school fees, a new phone — set a target and a date.', `<button class="btn sm" id="tGoal2">${I.plus} New goal</button>`)}
      </section>
      ${!biz && D.debts.length ? `<section class="card section"><div class="card-h"><h3 class="card-t">Debt payoff</h3><a class="small" href="#/debts">Manage debts</a></div>${(() => { const owed = sum(D.debts, d => d.owed), paid = sum(D.debts, d => Calc.debt(d).paid); return `${Frag.progressBar(pct(paid, owed), 'ok')}<div class="sub prog" style="border:0;padding-top:0"><span>${money(paid)} repaid of ${money(owed)}</span><span>${Math.round(pct(paid, owed))}%</span></div>`; })()}</section>` : ''}`;
  },
  _targets() {
    ['#tLimits', '#tLimits2', '#tLimits3'].forEach(s => { const b = $(s); if (b) b.onclick = () => Forms.budgets(); });
    ['#tGoal', '#tGoal2'].forEach(s => { const b = $(s); if (b) b.onclick = () => Forms.goal(); });
    $('#tEdit').onclick = () => Forms.target();
    $$('[data-goal]').forEach(el => el.onclick = e => { if (e.target.closest('[data-add]')) return; Forms.goal(Store.get('goals', el.dataset.goal)); });
    $$('[data-add]').forEach(b => b.onclick = e => { e.stopPropagation(); Forms.tx({ type: 'saving', goalId: b.dataset.add, title: 'Add to goal' }); });
  },

  /* ================= INVOICES (business) ================= */
  invoices(sub) {
    const tab = sub || 'invoices', rec = Calc.receivables(), ym = thisMonth();
    const paidMonth = sum(D.tx.filter(t => t.invoiceId && Calc.cleared(t) && monthOf(t.date) === ym), t => t.amount);
    const quotes = D.invoices.filter(i => i.kind === 'quote');
    const openQ = quotes.filter(q => q.status === 'sent');
    let body = '';
    if (tab === 'clients') {
      const rows = D.clients.map(c => { const inv = D.invoices.filter(i => i.clientId === c.id && i.kind !== 'quote' && i.status !== 'void'); const cs = inv.map(i => Calc.inv(i)); return { c, n: inv.length, billed: sum(cs, x => x.total), paid: sum(cs, x => x.paid), due: sum(cs, x => x.due), over: cs.filter(x => x.status === 'overdue').length }; }).sort((a, b) => b.due - a.due || b.billed - a.billed);
      body = `<div class="table-wrap"><table class="t"><thead><tr><th>Client</th><th>Contact</th><th class="r">Invoices</th><th class="r">Billed</th><th class="r">Paid</th><th class="r">Outstanding</th></tr></thead><tbody>${rows.map(r => `<tr class="tx-click" data-client="${esc(r.c.id)}"><td><b style="font-weight:500">${esc(r.c.name)}</b></td><td class="muted small">${esc([r.c.email, r.c.phone].filter(Boolean).join(' · ') || '—')}</td><td class="r">${r.n}</td><td class="r num">${money(r.billed)}</td><td class="r num">${money(r.paid)}</td><td class="r num ${r.over ? 'neg' : ''}">${money(r.due)}</td></tr>`).join('') || `<tr><td colspan="6">${Frag.empty('No clients yet', 'Clients are added automatically when you create an invoice.')}</td></tr>`}</tbody></table></div>`;
    } else {
      const list = D.invoices.filter(i => tab === 'quotes' ? i.kind === 'quote' : i.kind !== 'quote').map(i => ({ i, c: Calc.inv(i) }))
        .sort((a, b) => ({ overdue: 0, 'part-paid': 1, sent: 2, draft: 3 }[a.c.status] ?? 5) - ({ overdue: 0, 'part-paid': 1, sent: 2, draft: 3 }[b.c.status] ?? 5) || (b.i.issue || '').localeCompare(a.i.issue || ''));
      body = `<div class="table-wrap"><table class="t"><thead><tr><th>Number</th><th>Client</th><th>Issued</th><th>${tab === 'quotes' ? 'Valid until' : 'Due'}</th><th class="r">Total</th>${tab === 'quotes' ? '' : '<th class="r">Balance</th>'}<th>Status</th><th></th></tr></thead><tbody>
        ${list.map(({ i, c }) => `<tr class="tx-click" data-view="${esc(i.id)}"><td><b style="font-weight:500">${esc(i.number)}</b></td><td>${esc(Views.clientName(i))}</td><td class="muted">${fmtDate(i.issue)}</td><td class="${c.status === 'overdue' ? 'neg' : 'muted'}">${fmtDate(i.due)}${c.status === 'overdue' ? ` · ${c.overdueDays}d` : ''}</td><td class="r num">${money(c.total)}</td>${tab === 'quotes' ? '' : `<td class="r num" style="font-weight:500">${money(c.due)}${c.pendingPay ? `<div class="small warn">${money(c.pendingPay)} pending</div>` : ''}</td>`}
          <td><span class="chip ${STATUS_CHIP[c.status] || ''}">${STATUS_LABEL[c.status] || c.status}</span></td><td class="r"><button class="more" data-imenu="${esc(i.id)}" aria-label="Actions">${I.dots}</button></td></tr>`).join('')
        || `<tr><td colspan="8">${Frag.empty(tab === 'quotes' ? 'No quotations yet' : 'No invoices yet', tab === 'quotes' ? 'Send a quote, then convert it once it’s accepted.' : 'Create an invoice, send it, and record payments as they arrive.')}</td></tr>`}</tbody></table></div>`;
    }
    return `<div class="page-h"><div><h2>Invoices</h2><p>Bill clients, track who owes what, and record payments the moment they land.</p></div><div style="display:flex;gap:8px"><button class="btn soft" id="iQuote">New quotation</button><button class="btn" id="iNew">${I.plus} New invoice</button></div></div>
      <div class="grid g-4">${Frag.stat('Outstanding', money(rec.total), `${rec.open.length} unpaid invoice${rec.open.length === 1 ? '' : 's'}`)}${Frag.stat('Overdue', money(rec.overdue), rec.overdueCount ? `${rec.overdueCount} past due date` : 'None overdue', rec.overdue ? 'neg' : '')}${Frag.stat('Collected this month', money(paidMonth), monthName(ym))}${Frag.stat('Open quotations', String(openQ.length), money(sum(openQ, q => Calc.inv(q).total)) + ' potential')}</div>
      <section class="card section"><div class="toolbar"><div class="seg">${[['invoices', 'Invoices'], ['quotes', 'Quotations'], ['clients', 'Clients']].map(([k, l]) => `<button data-sub="${k}" class="${tab === k ? 'on' : ''}">${l}</button>`).join('')}</div><span class="grow"></span>${Views.agingStrip()}</div>${body}</section>`;
  },
  agingStrip() {
    const b = { '0–30': 0, '31–60': 0, '61–90': 0, '90+': 0 };
    Calc.receivables().open.filter(x => x.c.status === 'overdue').forEach(({ c }) => { const d = c.overdueDays; b[d <= 30 ? '0–30' : d <= 60 ? '31–60' : d <= 90 ? '61–90' : '90+'] += c.due; });
    return sum(Object.values(b), x => x) ? `<span class="small muted">Overdue by days: ${Object.entries(b).map(([k, v]) => `${k} <b class="${v ? 'neg' : ''}" style="font-weight:500">${money(v, { compact: true })}</b>`).join(' · ')}</span>` : '';
  },
  invMenu(anchor, id) {
    const i = Store.get('invoices', id); if (!i) return; const c = Calc.inv(i), q = i.kind === 'quote';
    UI.menu(anchor, [
      { label: 'View / print', fn: () => Views.viewInvoice(id) },
      ...(!q && c.due > 0 && i.status !== 'void' ? [{ label: 'Record payment', fn: () => Forms.tx({ type: 'income', invoiceId: id, amount: c.due, party: Views.clientName(i), categoryId: (D.categories.find(x => x.kind === 'income') || {}).id, title: 'Payment for ' + i.number }) }, { label: 'Expect payment (pending)', fn: () => Forms.tx({ type: 'income', status: 'pending', invoiceId: id, amount: c.due, party: Views.clientName(i), title: 'Expected payment' }) }] : []),
      ...(i.status === 'draft' ? [{ label: 'Mark as sent', fn: () => { Store.upsert('invoices', { ...i, status: 'sent' }); API.audit('INVOICE_SENT', i.number, ''); } }] : []),
      ...(q && i.status !== 'declined' ? [{ label: 'Convert to invoice', fn: () => Views.convertQuote(i) }] : []),
      { label: 'Copy payment reminder', fn: () => Views.reminder(i) },
      { label: 'Edit', fn: () => Forms.invoice(i) },
      { label: 'Duplicate', fn: () => { const s = D.settings; const n = { ...JSON.parse(JSON.stringify(i)), id: uid('i_'), number: (q ? s.quotePrefix : s.invoicePrefix) + String(q ? s.nextQuote : s.nextInvoice).padStart(4, '0'), issue: today(), due: addDays(today(), num(s.payTerms) || 14), status: 'draft' }; Store.patch('settings', q ? { nextQuote: num(s.nextQuote) + 1 } : { nextInvoice: num(s.nextInvoice) + 1 }); Store.upsert('invoices', n); Forms.invoice(n); } },
      'sep',
      ...(i.status === 'draft' || (q && !c.paid) ? [{ label: 'Delete', danger: true, fn: async () => { if (await UI.confirm(`Delete ${i.number}?`, { ok: 'Delete', danger: true })) { Store.remove('invoices', id); API.audit('INVOICE_DELETED', i.number, 'Draft deleted'); } } }]
        : i.status !== 'void' ? [{ label: 'Void', danger: true, fn: async () => { if (await UI.confirm(`Void ${i.number}?`, { ok: 'Void invoice', danger: true, detail: 'It stays in your records for audit purposes but no longer counts as owed.' })) { Store.upsert('invoices', { ...i, status: 'void', voidedAt: Date.now() }); API.audit('INVOICE_VOIDED', i.number, 'Voided'); } } }] : []),
    ]);
  },
  convertQuote(qt) {
    const s = D.settings; const n = { ...JSON.parse(JSON.stringify(qt)), id: uid('i_'), kind: 'invoice', number: (s.invoicePrefix || 'INV-') + String(num(s.nextInvoice) || 1).padStart(4, '0'), issue: today(), due: addDays(today(), num(s.payTerms) || 14), status: 'sent', fromQuote: qt.id };
    Store.patch('settings', { nextInvoice: (num(s.nextInvoice) || 1) + 1 }); Store.upsert('invoices', { ...qt, status: 'accepted' }); Store.upsert('invoices', n);
    API.audit('QUOTE_CONVERTED', qt.number, 'Invoice ' + n.number); UI.toast(`${n.number} created from ${qt.number}`);
  },
  reminder(i) {
    const c = Calc.inv(i), s = D.settings;
    const txt = `Hi ${Views.clientName(i)}, a friendly reminder that invoice ${i.number} for ${money(c.due, { raw: true })} ${c.status === 'overdue' ? `was due on ${fmtDate(i.due)}` : `is due on ${fmtDate(i.due)}`}.${s.paymentDetails ? ' Payment details: ' + s.paymentDetails : ''} Thank you — ${s.name || App.name()}`;
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => UI.toast('Reminder copied — paste into WhatsApp or email'), () => UI.modal(`<h3>Payment reminder</h3><textarea class="input" style="width:100%;min-height:120px;border-radius:12px">${esc(txt)}</textarea><div class="modal-actions"><button class="btn" data-close>Done</button></div>`));
  },
  viewInvoice(id) {
    const i = Store.get('invoices', id); if (!i) return; const c = Calc.inv(i), s = D.settings, cl = D.clients.find(x => x.id === i.clientId) || {}, q = i.kind === 'quote';
    const pays = D.tx.filter(t => t.invoiceId === i.id).sort((a, b) => a.date.localeCompare(b.date));
    const m = UI.modal(`<div class="invoice-doc">
      <div class="ih"><div><div class="brand" style="font-size:18px"><i>${I.logo}</i>${esc(s.name || App.name())}</div><div class="small muted" style="margin-top:8px;white-space:pre-line">${esc([s.address, s.email, D.tax.tin ? 'BP/TIN: ' + D.tax.tin : ''].filter(Boolean).join('\n'))}</div></div>
        <div style="text-align:right"><h1>${q ? 'Quotation' : 'Invoice'}</h1><div class="muted">${esc(i.number)}</div><div style="margin-top:6px"><span class="chip ${STATUS_CHIP[c.status] || ''} no-print">${STATUS_LABEL[c.status]}</span></div></div></div>
      <div class="ih"><div><div class="small muted">Bill to</div><b style="font-weight:500">${esc(cl.name || Views.clientName(i))}</b><div class="small muted" style="white-space:pre-line">${esc([cl.address, cl.email, cl.phone].filter(Boolean).join('\n'))}</div></div>
        <div style="text-align:right" class="small"><div><span class="muted">Issued</span> ${esc(i.issue)}</div><div><span class="muted">${q ? 'Valid until' : 'Due'}</span> ${esc(i.due || '—')}</div></div></div>
      <table><thead><tr><th>Description</th><th class="r">Qty</th><th class="r">Price</th><th class="r">Amount</th></tr></thead><tbody>${(i.lines || []).map(l => `<tr><td>${esc(l.d)}</td><td class="r">${esc(l.q)}</td><td class="r">${money(l.p, { raw: true })}</td><td class="r">${money(num(l.q) * num(l.p), { raw: true })}</td></tr>`).join('')}</tbody></table>
      <div class="totals"><div><span>Subtotal</span><span>${money(c.sub, { raw: true })}</span></div>${c.vat ? `<div><span>VAT ${esc(i.vatRate)}%</span><span>${money(c.vat, { raw: true })}</span></div>` : ''}<div class="grand"><span>Total</span><span>${money(c.total, { raw: true })}</span></div>${!q && c.paid ? `<div><span>Paid</span><span>−${money(c.paid, { raw: true })}</span></div><div class="grand"><span>Balance due</span><span>${money(c.due, { raw: true })}</span></div>` : ''}</div>
      ${i.notes || s.paymentDetails ? `<div style="margin-top:24px;white-space:pre-line" class="small">${esc(i.notes || '')}${s.paymentDetails && !q ? `\n\n<b>Payment details</b>\n${esc(s.paymentDetails)}` : ''}</div>` : ''}

/* ---------- reports & exports ---------- */
const Reports = {
  period(p) {
    const t = today(), y = t.slice(0, 4), m = thisMonth();
    switch (p) {
      case 'this-month': return [m + '-01', t, monthName(m)];
      case 'last-month': { const lm = addMonths(m, -1); return [lm + '-01', lm + '-' + pad(daysInMonth(lm)), monthName(lm)]; }
      case 'this-quarter': { const q = Math.floor((Number(m.slice(5)) - 1) / 3) * 3 + 1; return [`${y}-${pad(q)}-01`, t, `Q${(q + 2) / 3} ${y}`]; }
      case 'last-12': return [addMonths(m, -11) + '-01', t, 'Last 12 months'];
      case 'last-year': return [`${y - 1}-01-01`, `${y - 1}-12-31`, String(y - 1)];
      case 'all': return ['0000-01-01', '9999-12-31', 'All time'];
      default: return [`${y}-01-01`, t, y + ' to date'];
    }
  },
  invSet() { return D.invoices.filter(i => i.kind !== 'quote' && i.status !== 'void' && (i.status !== 'draft' || Calc.inv(i).paid > 0)); },
  pl(from, to, basis) {
    const S = new Set(this.invSet().map(i => i.id));
    const ts = Calc.range(from, to); const inc = {}, exp = {}; let vatOut = 0, vatIn = 0;
    ts.forEach(t => {
      if (t.type === 'income') { if (basis === 'accrual' && S.has(t.invoiceId)) return; inc[t.categoryId] = (inc[t.categoryId] || 0) + t.amount - num(t.vat); vatOut += num(t.vat); }
      else if (t.type === 'expense') { exp[t.categoryId] = (exp[t.categoryId] || 0) + t.amount - num(t.vat); vatIn += num(t.vat); }
    });
    if (basis === 'accrual') this.invSet().filter(i => i.issue >= from && i.issue <= to).forEach(i => { const c = Calc.inv(i); const k = (D.categories.find(x => x.kind === 'income') || {}).id; inc[k] = (inc[k] || 0) + c.sub; vatOut += c.vat; });
    else { /* cash basis: invoice payments counted gross; split VAT proportionally */
      ts.filter(t => t.type === 'income' && S.has(t.invoiceId)).forEach(t => { const i = D.invoices.find(x => x.id === t.invoiceId); const c = Calc.inv(i); const share = c.total ? c.vat / c.total : 0; inc[t.categoryId] -= t.amount * share; inc[t.categoryId] += num(t.vat); vatOut += t.amount * share - num(t.vat); });
    }
    const ti = sum(Object.values(inc), x => x), te = sum(Object.values(exp), x => x);
    return { inc, exp, ti, te, net: ti - te, vatOut: round2(vatOut), vatIn: round2(vatIn) };
  },
  trial() {
    const S = new Set(this.invSet().map(i => i.id)); const all = D.tx.filter(Calc.cleared); const rows = [];
    D.accounts.forEach(a => rows.push([a.name, Calc.acctBalance(a.id), 0]));
    const inv = this.invSet().map(i => ({ i, c: Calc.inv(i) }));
    const invPaid = sum(all.filter(t => t.type === 'income' && S.has(t.invoiceId)), t => t.amount);
    rows.push(['Accounts receivable', round2(sum(inv, x => x.c.total) - invPaid), 0]);
    const sav = sum(all.filter(t => t.type === 'saving'), t => t.amount); if (sav) rows.push(['Savings set aside', round2(sav), 0]);
    const exp = {}; let vin = 0; all.filter(t => t.type === 'expense').forEach(t => { exp[t.categoryId] = (exp[t.categoryId] || 0) + t.amount - num(t.vat); vin += num(t.vat); });
    Object.entries(exp).forEach(([k, v]) => rows.push([Calc.cat(k).name, round2(v), 0]));
    if (vin) rows.push(['Input VAT', round2(vin), 0]);
    const rev = {}; let vout = sum(inv, x => x.c.vat); const salesId = (D.categories.find(x => x.kind === 'income') || {}).id;
    rev[salesId] = sum(inv, x => x.c.sub);
    all.filter(t => t.type === 'income' && !S.has(t.invoiceId)).forEach(t => { rev[t.categoryId] = (rev[t.categoryId] || 0) + t.amount - num(t.vat); vout += num(t.vat); });
    Object.entries(rev).forEach(([k, v]) => v && rows.push([Calc.cat(k).name + ' (revenue)', 0, round2(v)]));
    if (vout) rows.push(['Output VAT', 0, round2(vout)]);
    rows.push(['Opening balances / owner equity', 0, round2(sum(D.accounts, a => num(a.opening)))]);
    const fix = rows.map(([n, d, c]) => d < 0 ? [n, 0, -d] : c < 0 ? [n, -c, 0] : [n, d, c]);
    return { rows: fix, dr: round2(sum(fix, r => r[1])), cr: round2(sum(fix, r => r[2])) };
  },
  exportTx() { download(`fundly-transactions-${today()}.csv`, toCSV([['Date', 'Type', 'Description', 'Category', 'Account', 'Status', 'Amount', 'VAT', 'Note', 'Invoice', 'Recorded by'], ...D.tx.slice().sort((a, b) => a.date.localeCompare(b.date)).map(t => [t.date, t.type, t.party, t.type === 'saving' ? 'Savings' : Calc.cat(t.categoryId).name, Calc.acct(t.accountId).name, t.status, t.type === 'income' ? t.amount : -t.amount, t.vat || '', t.note, (D.invoices.find(i => i.id === t.invoiceId) || {}).number || '', t.by || ''])]), 'text/csv'); },
  exportInvoices() { download(`fundly-invoices-${today()}.csv`, toCSV([['Number', 'Type', 'Client', 'Issued', 'Due', 'Subtotal', 'VAT', 'Total', 'Paid', 'Balance', 'Status'], ...D.invoices.map(i => { const c = Calc.inv(i); return [i.number, i.kind, Views.clientName(i), i.issue, i.due, c.sub, c.vat, c.total, c.paid, c.due, c.status]; })]), 'text/csv'); },
};

    $('#oNew').onclick = () => Forms.compliance();
    $$('[data-obl]').forEach(r => r.onclick = e => { if (e.target.closest('[data-done]')) return; Forms.compliance(Store.get('compliance', r.dataset.obl)); });
    $$('[data-done]').forEach(b => b.onclick = e => { e.stopPropagation(); const o = Store.get('compliance', b.dataset.done); Store.upsert('compliance', { ...o, status: 'done', doneAt: today() }); API.audit('COMPLIANCE_FILED', o.title, o.period); UI.toast('Marked as filed', { undo: () => Store.upsert('compliance', o) }); });
    $('#taxF').onsubmit = e => { e.preventDefault(); const v = UI.form(e.target); Store.patch('settings', { vatDefault: num(v.vatDefault) }); delete v.vatDefault; Store.patch('tax', { ...v, citRate: v.citRate === '' ? '' : num(v.citRate) }); API.audit('TAX_PROFILE_UPDATED', 'Tax profile', 'Updated'); UI.toast('Tax profile saved'); };
  },

  recurring() {
    const rs = D.recurring.slice().sort((a, b) => (b.active - a.active) || (a.next || '').localeCompare(b.next || ''));
    const monthlyOut = sum(rs.filter(r => r.active && r.type === 'expense'), r => r.amount * ({ weekly: 52 / 12, monthly: 1, quarterly: 1 / 3, yearly: 1 / 12 }[r.freq] || 1));
    return `<section class="card"><div class="card-h"><div><h3 class="card-t">Recurring payments</h3><p class="small muted" style="margin:4px 0 0">Rent, salaries, subscriptions, retainers. Each due date drops a pending payment into your feed to confirm. Committed spend ≈ <b class="num" style="font-weight:500">${money(monthlyOut)}</b>/month.</p></div><button class="btn sm" id="rNew">${I.plus} New</button></div>
      ${rs.length ? `<div class="table-wrap"><table class="t"><thead><tr><th>Name</th><th>Repeats</th><th>Next due</th><th>Category</th><th class="r">Amount</th><th></th></tr></thead><tbody>${rs.map(r => `<tr class="tx-click" data-rec="${esc(r.id)}"><td><b style="font-weight:500">${esc(r.label)}</b></td><td class="muted">${esc(r.freq)}</td><td>${r.active ? fmtDate(r.next) : '<span class="chip">Paused</span>'}</td><td class="muted">${esc(Calc.cat(r.categoryId).name)}</td><td class="r num ${r.type === 'income' ? 'pos' : 'neg'}">${money(r.type === 'income' ? r.amount : -r.amount, { sign: true })}</td><td></td></tr>`).join('')}</tbody></table></div>`
        : Frag.empty('Nothing recurring yet', 'Set up rent, salaries or subscriptions once and stop re-typing them.')}</section>`;
  },
  _recurring() { $('#rNew').onclick = () => Forms.recurring(); $$('[data-rec]').forEach(r => r.onclick = () => Forms.recurring(Store.get('recurring', r.dataset.rec))); },

  audit() { return `<section class="card"><div class="card-h"><div><h3 class="card-t">Audit trail</h3><p class="small muted" style="margin:4px 0 0">Every change is logged on this device in a hash chain, so edits to past entries are detectable.</p></div><span id="auditState" class="chip">Checking…</span></div><div id="auditList"><div class="empty">Loading…</div></div></section>`; },
  async _audit() {
    try {
      const r = await API.auditLog(); const s = $('#auditState'); if (!s) return;
      s.className = 'chip ' + (r.intact ? 'pos' : 'neg'); s.textContent = r.intact ? `✓ Chain verified · ${r.count} events` : 'Integrity problem detected';
      $('#auditList').innerHTML = r.events.length ? `<div class="table-wrap"><table class="t"><thead><tr><th>When</th><th>User</th><th>Action</th><th>Record</th><th>Details</th><th>Hash</th></tr></thead><tbody>${r.events.map(e => `<tr><td class="small" style="white-space:nowrap">${esc(new Date(e.at).toLocaleString())}</td><td>${esc(e.user)}</td><td><span class="chip">${esc(String(e.type).replace(/_/g, ' ').toLowerCase())}</span></td><td>${esc(e.record)}</td><td class="small muted">${esc(e.text)}</td><td class="small muted" title="${esc(e.hash)}"><code>${esc(String(e.hash).slice(0, 10))}</code></td></tr>`).join('')}</tbody></table></div>` : Frag.empty('No events yet', '');
    } catch (e) { const l = $('#auditList'); if (l) l.innerHTML = Frag.empty('Couldn’t load the audit trail', e.message); }
  },

  settings() {
    const s = D.settings, biz = Calc.biz();
    const catList = kind => D.categories.filter(c => c.kind === kind).map(c => `<button class="chip tx-click" data-cat="${esc(c.id)}" style="border:0;padding:7px 12px">${kind === 'expense' ? `<i style="width:8px;height:8px;border-radius:2px;background:${catColor(c.id)};display:inline-block"></i>` : ''}${esc(c.name)}</button>`).join(' ');
    return `<div class="grid g-2">
      <section class="card"><div class="card-h"><h3 class="card-t">Workspace</h3></div><form id="sF"><div class="form">
        <div class="f"><label>Your name</label><input name="display_name" value="${esc(App.user.display_name || '')}"></div>
        <div class="f"><label>${biz ? 'Business' : 'Household'} name</label><input name="name" value="${esc(s.name || '')}"></div>
        <div class="f"><label>Main currency</label><select name="currency">${UI.opts(['USD', 'ZWG', 'ZAR', 'GBP', 'EUR', 'BWP', 'ZMW', 'KES', 'NGN'].map(c => ({ value: c, label: c })), s.currency)}</select><span class="hint">Changing this relabels amounts; it doesn’t convert them.</span></div>
        <div class="f"><label>Monthly ${biz ? 'revenue' : 'income'} target</label><input name="monthlyTarget" inputmode="decimal" value="${esc(s.monthlyTarget || '')}"></div>
        ${(s.display || []).map((d, k) => `<div class="f"><label>Also show in</label><input name="dc${k}" value="${esc(d.code)}" maxlength="3" style="text-transform:uppercase"></div><div class="f"><label>Rate: 1 ${esc(s.currency)} =</label><input name="dr${k}" inputmode="decimal" value="${esc(d.rate || '')}" placeholder="Enter today’s rate"></div>`).join('')}
        ${biz ? `<div class="f"><label>Invoice prefix</label><input name="invoicePrefix" value="${esc(s.invoicePrefix || 'INV-')}"></div><div class="f"><label>Payment terms (days)</label><input name="payTerms" inputmode="numeric" value="${esc(s.payTerms || 14)}"></div>
        <div class="f full"><label>Business address & email (on invoices)</label><input name="address" value="${esc(s.address || '')}" placeholder="Address"><input name="email" value="${esc(s.email || '')}" placeholder="Email" style="margin-top:6px"></div>
        <div class="f full"><label>Payment details (on invoices & reminders)</label><textarea name="paymentDetails" placeholder="Bank, account no., EcoCash merchant code…">${esc(s.paymentDetails || '')}</textarea></div>` : ''}
      </div><div class="modal-actions"><button class="btn">Save settings</button></div></form></section>
      <div style="display:flex;flex-direction:column;gap:16px">
        <section class="card"><div class="card-h"><h3 class="card-t">Accounts</h3><button class="btn soft sm" id="sAcct">${I.plus} Add</button></div>${D.accounts.map(a => `<div class="tx tx-click" data-acct="${esc(a.id)}"><div class="av">${esc(initials(a.name))}</div><div class="meta"><b>${esc(a.name)}</b><small>${esc(a.kind)} · opening ${money(a.opening, { raw: true })}</small></div><div class="amt num">${money(Calc.acctBalance(a.id))}</div></div>`).join('')}</section>
        <section class="card"><div class="card-h"><h3 class="card-t">Categories</h3><button class="btn soft sm" id="sCat">${I.plus} Add</button></div><div class="small muted" style="margin-bottom:6px">Money in</div><div style="display:flex;flex-wrap:wrap;gap:6px">${catList('income')}</div><div class="small muted" style="margin:14px 0 6px">Money out</div><div style="display:flex;flex-wrap:wrap;gap:6px">${catList('expense')}</div></section>
        <section class="card"><div class="card-h"><h3 class="card-t">Passcode</h3></div><p class="small muted" style="margin-top:0">${App.profile.lock ? 'This profile is locked with a passcode.' : 'Add a passcode so others using this device can’t open your profile.'} Records are kept unencrypted in this browser, so also protect the device itself.</p><form id="pwF"><div class="form">${App.profile.lock ? '<div class="f full"><label>Current passcode</label><input type="password" name="cur" autocomplete="current-password"></div>' : ''}<div class="f"><label>New passcode</label><input type="password" name="n1" autocomplete="new-password"></div><div class="f"><label>Confirm</label><input type="password" name="n2" autocomplete="new-password"></div></div>
          <div class="modal-actions"><button type="button" class="btn soft left" id="sOut">Lock now</button>${App.profile.lock ? '<button type="button" class="btn soft" id="pwOff">Remove passcode</button>' : ''}<button class="btn">${App.profile.lock ? 'Change' : 'Set'} passcode</button></div></form></section>
      </div></div>`;
  },
  _settings() {
    $('#sF').onsubmit = async e => {
      e.preventDefault(); const v = UI.form(e.target); const s = D.settings;
      const display = (s.display || []).map((d, k) => ({ code: String(v['dc' + k] || '').toUpperCase().trim(), rate: num(v['dr' + k]) })).filter(d => d.code && d.code !== v.currency);
      const patch = { name: v.name.trim(), currency: v.currency, monthlyTarget: round2(num(v.monthlyTarget)), display: display.length ? display : s.display };
      ['invoicePrefix', 'payTerms', 'address', 'email', 'paymentDetails'].forEach(k => { if (k in v) patch[k] = k === 'payTerms' ? num(v[k]) : v[k]; });
      Store.patch('settings', patch);
      const nm = (v.display_name || '').trim(); if (nm && nm !== App.profile.name) { App.profile = { ...App.profile, name: nm }; Profiles.update(App.profile); App.user.username = App.user.display_name = nm; App.shell(); App.render(); }
      if (Fmt.display && !patch.display.some(d => d.code === Fmt.display)) Fmt.display = null;
      UI.toast('Settings saved');
    };
    $('#sAcct').onclick = () => Forms.account(); $('#sCat').onclick = () => Forms.category();
    $$('[data-acct]').forEach(r => r.onclick = () => Forms.account(Store.get('accounts', r.dataset.acct)));
    $$('[data-cat]').forEach(r => r.onclick = () => Forms.category(Store.get('categories', r.dataset.cat)));
    $('#sOut').onclick = () => App.logout();
    $('#pwF').onsubmit = e => { e.preventDefault(); const v = UI.form(e.target); const p = App.profile; if (p.lock && !Profiles.check(p, v.cur)) return UI.toast('Current passcode isn’t right'); if (v.n1.length < 4) return UI.toast('Use at least 4 characters'); if (v.n1 !== v.n2) return UI.toast('Passcodes don’t match'); p.lock = Profiles.hash(v.n1, p.salt); Profiles.update(p); API.audit('PASSCODE_SET', p.name, ''); UI.toast('Passcode saved'); App.render(); };
    const off = $('#pwOff'); if (off) off.onclick = () => { const p = App.profile; if (!Profiles.check(p, $('#pwF [name=cur]').value)) return UI.toast('Enter your current passcode first'); delete p.lock; Profiles.update(p); API.audit('PASSCODE_REMOVED', p.name, ''); UI.toast('Passcode removed'); App.render(); };
  },

  data() {
    const last = D.settings.lastBackup; const used = (() => { let n = 0; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); n += k.length + (localStorage.getItem(k) || '').length; } return n * 2; })();
    const hasLegacy = Object.keys(API.legacy()).length > 0;
    return `<div class="grid g-2"><section class="card"><div class="card-h"><h3 class="card-t">Backup & move devices</h3><span class="chip ${last ? '' : 'warn'}">${last ? 'Last backup ' + fmtDate(last) : 'No backup yet'}</span></div><p class="muted" style="margin-top:0">Fundly keeps everything in this browser on this device. Download a backup file regularly. To use Fundly on another phone or computer, open fundly.html there and choose <b>Restore a backup</b>.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="bExp">Download backup</button><button class="btn soft" id="bImp">Restore into this profile</button><input type="file" id="bFile" accept="application/json,.json" hidden></div>
        <p class="small muted">Backups include receipts and the audit trail. Storage used on this device: about ${(used / 1048576).toFixed(1)} MB of the ~5 MB most browsers allow.</p></section>
      <section class="card">${hasLegacy ? `<div class="card-h"><h3 class="card-t">Fundly 1 archive</h3></div><p class="muted" style="margin-top:0">Your original Fundly 1 records in this browser are left unchanged.</p><button class="btn soft" id="bLegacy">Download Fundly 1 archive</button>` : ''}
        <div class="card-h" style="margin-top:${hasLegacy ? 26 : 0}px"><h3 class="card-t neg">Start over</h3></div><p class="muted" style="margin-top:0">Erase all records in this profile, or delete the profile entirely.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn danger" id="bReset">Erase data</button><button class="btn danger" id="bDelP">Delete profile</button></div></section></div>`;
  },
  _data() {
    $('#bExp').onclick = () => Backup.download();
    $('#bImp').onclick = () => $('#bFile').click();
    $('#bFile').onchange = e => Backup.restoreFile(e.target.files[0], false);
    const lg = $('#bLegacy'); if (lg) lg.onclick = () => download(`fundly1-archive-${today()}.json`, JSON.stringify(API.legacy(), null, 2), 'application/json');
    $('#bReset').onclick = () => {
      const m = UI.modal(`<h3>Erase this profile’s data?</h3><p class="lead">Every transaction, invoice, goal and setting will be removed. Type <b>ERASE</b> to confirm.</p><input class="input" id="eraseIn" style="width:100%" autocomplete="off"><div class="modal-actions"><button class="btn soft" data-close>Cancel</button><button class="btn danger" id="eraseGo">Erase</button></div>`);
      $('#eraseGo', m).onclick = () => { if ($('#eraseIn', m).value !== 'ERASE') return UI.toast('Type ERASE to confirm'); const biz = Calc.biz(); const seed = { settings: { ...Defaults.settings(biz), onboarded: false }, categories: Defaults.categories(biz), accounts: Defaults.accounts(biz), tax: {} }; KEYS.forEach(k => Store.replaceAll(k, seed[k] !== undefined ? seed[k] : (ARRAYS.includes(k) ? [] : {}))); Store.flush(); Store.emit(false); API.audit('DATA_ERASED', 'Profile', 'All records erased'); m.close(); Forms.onboarding(); };
    };
    $('#bDelP').onclick = async () => { if (await UI.confirm(`Delete the profile “${App.profile.name}”?`, { ok: 'Delete profile', danger: true, detail: 'All of its records on this device are removed permanently. Download a backup first if you might need them.' })) { const id = App.profile.id; App.lock(); Profiles.remove(id); Auth.render(); } };
  },
};

/* ---------- start ---------- */
App.boot();

</script>
<script>
/* Offline support + installable app (only when served over http/https, e.g. GitHub Pages) */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
