<style>
/* Fundly 2 — minimal finance UI */
:root{
  --canvas:#e6e7e4; --shell:#f3f4f1; --card:#ffffff; --ink:#151a14; --ink-2:#3b4339; --muted:#8b9188; --faint:#b9bdb6;
  --line:#ececea; --line-2:#e2e4df; --chip:#f1f2ef;
  --lime:#b6ec7c; --lime-2:#c9f39b; --lime-3:#a6e06a; --lime-ink:#1d3a12; --lime-soft:#eef9e1;
  --forest:#1e4620; --forest-2:#2b5d2c;
  --pos:#1d9a4f; --neg:#e0453c; --warn:#ef6b1f; --warn-soft:#fff1e8; --neg-soft:#fdecea; --pos-soft:#e7f6ec;
  --r-xl:30px; --r-lg:24px; --r-md:16px; --r-sm:12px; --pill:999px;
  --shadow:0 1px 2px rgba(20,30,20,.04);
  --font:"Outfit","Urbanist",ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--canvas);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;min-width:320px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Shell */
.shell{max-width:1240px;margin:28px auto;background:var(--shell);border-radius:var(--r-xl);padding:22px 22px 26px;min-height:calc(100vh - 56px)}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:2px 4px 22px}
.hello{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none;border:2px solid #fff}
.hello h1{font-size:25px;font-weight:500;margin:0;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hello small{display:block;font-size:12px;color:var(--muted);margin-top:-2px}
.nav{display:flex;gap:4px;background:transparent}
.nav a{text-decoration:none;color:var(--muted);font-size:14px;padding:9px 18px;border-radius:var(--pill);transition:.15s;white-space:nowrap}
.nav a:hover{color:var(--ink)}
.nav a.on{background:var(--lime);color:var(--lime-ink);font-weight:500}
.tools{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;color:var(--ink);position:relative}
.icon-btn:hover{background:#fafbf8}
.icon-btn svg{width:18px;height:18px}
.bell{width:auto;padding:0 14px 0 12px;border-radius:var(--pill);display:flex;gap:6px;font-size:13px;font-weight:500}
.bell .dot{position:absolute;top:10px;left:23px;width:7px;height:7px;border-radius:50%;background:var(--neg);border:1.5px solid #fff}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:0 6px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--pos);box-shadow:0 0 0 3px var(--pos-soft)}
.live.off i{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.live.pulse i{animation:pulse .9s ease}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.7)}100%{transform:scale(1)}}

/* Cards & grid */
.grid{display:grid;gap:16px}
.g-hero{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border-radius:var(--r-lg);padding:22px;min-width:0;position:relative;box-shadow:var(--shadow)}
.card.lime{background:var(--lime)}
.card.flat{background:transparent;box-shadow:none;padding:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.card-t{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:500;margin:0}
.badge-ic{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;flex:none}
.badge-ic svg{width:16px;height:16px}
.section{margin-top:16px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 4px 16px;flex-wrap:wrap}
.page-h h2{font-size:26px;font-weight:500;letter-spacing:-.02em;margin:0}
.page-h p{margin:2px 0 0;color:var(--muted);font-size:14px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}

/* Buttons & chips */
.btn{border:1px solid transparent;border-radius:var(--pill);padding:10px 18px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;background:var(--forest);color:#e9f8da;white-space:nowrap;transition:.15s}
.btn:hover{background:var(--forest-2)}
.btn svg{width:16px;height:16px}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--ink)}
.btn.ghost:hover{background:#fafaf8}
.btn.soft{background:var(--chip);color:var(--ink)}
.btn.soft:hover{background:#e9ebe6}
.btn.lime{background:var(--lime);color:var(--lime-ink)}
.btn.danger{background:var(--neg-soft);color:var(--neg)}
.btn.sm{padding:7px 13px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.more{border:0;background:transparent;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.more:hover{background:var(--chip)}
.more.bordered{border:1px solid var(--line-2);width:40px;height:40px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--pill);font-size:12px;font-weight:500;background:var(--chip);color:var(--ink-2);white-space:nowrap}
.chip.pos{background:var(--pos-soft);color:var(--pos)} .chip.neg{background:var(--neg-soft);color:var(--neg)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.lime{background:var(--lime-soft);color:var(--lime-ink)} .chip.dark{background:var(--forest);color:#e9f8da}
.chip.white{background:#fff;color:var(--pos)}
.big .chip{letter-spacing:0;font-variant-numeric:normal}
.seg{display:inline-flex;background:var(--chip);border-radius:var(--pill);padding:4px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:var(--pill);font-size:13px;font-weight:500;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);color:var(--ink)}
.pill-btn{border:1px solid var(--line-2);background:#fff;border-radius:var(--pill);padding:7px 14px;font-size:13px}

/* Balance hero */
.hero{display:flex;flex-direction:column;min-height:256px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.acct{text-align:right}
.acct small{display:block;font-size:12px;color:var(--muted)}
.acct b{font-weight:500;font-size:17px;display:inline-flex;align-items:center;gap:6px}
.copy{border:0;background:none;padding:2px;color:var(--ink-2);display:inline-grid}
.copy svg{width:14px;height:14px}
.label{font-size:13px;color:var(--ink-2);margin:26px 0 4px}
.big{font-size:clamp(38px,5vw,56px);font-weight:400;letter-spacing:-.035em;line-height:1.05;display:flex;align-items:center;gap:14px}
.eye{border:0;width:34px;height:34px;border-radius:50%;background:var(--chip);display:grid;place-items:center;color:var(--ink-2);flex:none}
.eye svg{width:16px;height:16px}
.hero-sub{font-size:13px;color:var(--muted);margin-top:6px}
.hero-actions{display:flex;align-items:flex-end;gap:10px;margin-top:auto;padding-top:22px;flex-wrap:wrap}
.fab{margin-left:auto;width:62px;height:62px;border-radius:50%;background:var(--lime);border:0;display:grid;place-items:center;color:var(--lime-ink);transition:.2s}
.fab:hover{transform:rotate(45deg)}
.fab svg{width:24px;height:24px}

/* Targets (lime) card */
.target-card{overflow:hidden;display:flex;flex-direction:column}
.target-card .star{position:absolute;right:-26px;top:-6px;width:170px;height:170px;opacity:.45;color:var(--lime-3);pointer-events:none}
.tag{display:inline-flex;align-items:center;gap:10px;background:var(--forest);color:#d9f6bb;border-radius:var(--pill);padding:5px 5px 5px 16px;font-size:13px;letter-spacing:.08em;font-weight:500}
.tag i{width:28px;height:28px;border-radius:50%;background:var(--lime);display:grid;place-items:center;color:var(--forest)}
.tag i svg{width:14px;height:14px}
.target-card .more{background:rgba(255,255,255,.35)}
.target-card .label{color:var(--lime-ink);margin-top:20px}
.target-card .big{font-size:clamp(34px,4vw,44px);color:var(--lime-ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto;padding-top:18px}
.tile{background:rgba(255,255,255,.35);border-radius:var(--r-md);padding:12px 14px;color:var(--lime-ink)}
.tile small{display:flex;justify-content:space-between;font-size:12px;opacity:.85}
.tile b{display:block;font-size:20px;font-weight:500;margin-top:4px}
.track{height:8px;border-radius:99px;background:rgba(255,255,255,.45);overflow:hidden;margin-top:14px;position:relative}
.track span{display:block;height:100%;background:var(--forest);border-radius:99px}
.hist{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:auto;padding-top:18px}
.hist div{background:rgba(255,255,255,.35);border-radius:12px;padding:7px 8px;color:var(--lime-ink);font-size:11px}
.hist b{display:block;font-size:15px;font-weight:500}
.track .pace{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--lime-ink);opacity:.6}

/* Spending donut */
.donut-wrap{position:relative;width:190px;height:190px;margin:4px auto 8px}
.donut-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut-wrap path{transition:opacity .15s}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut-c b{font-size:20px;font-weight:500;letter-spacing:-.02em}
.insight{display:flex;justify-content:center;margin:6px 0 14px}
.insight span{border:1px solid var(--line-2);border-radius:var(--pill);padding:6px 12px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:13px}
.legend div{display:flex;align-items:center;gap:7px;min-width:0;color:var(--ink-2)}
.legend div.dim{color:var(--faint)}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}
.legend span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.legend em{font-style:normal;font-weight:500;flex:none;color:var(--ink)}
.legend div.dim em{color:var(--faint);font-weight:400}

/* Earnings bars */
.goal-chip{text-align:right}
.goal-chip b{display:flex;gap:6px;align-items:center;font-weight:500;justify-content:flex-end}
.goal-chip b svg{width:15px;height:15px}
.goal-line{height:4px;border-radius:9px;background:var(--line);margin-top:4px;overflow:hidden;width:90px;margin-left:auto}
.goal-line span{display:block;height:100%;background:var(--warn);border-radius:9px}
.rows{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.brow{font-size:13px}
.brow .top{display:flex;justify-content:space-between;color:var(--ink-2)}
.brow.dim .top{color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--chip);margin-top:6px;position:relative}
.bar span{display:block;height:100%;border-radius:99px;background:#dcded9;min-width:4px}
.bar.hi span{background:var(--lime)}
.bar .pct{position:absolute;top:50%;transform:translate(-50%,-50%);background:var(--forest);color:#d9f6bb;font-size:11px;padding:2px 8px;border-radius:99px}
.bar.over span{background:var(--neg)}
.bar.near span{background:var(--warn)}
.bar.ok span{background:var(--lime-3)}

/* Transactions list */
.tx{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .av{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none;background:#fff}
.tx .meta{flex:1;min-width:0}
.tx .meta b{font-weight:500;display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .meta small{color:var(--muted);font-size:12px}
.tx .amt{font-weight:500;white-space:nowrap}
.tx.pending{border:1px solid #f6d9c6;background:#fffaf6;border-radius:var(--r-md);padding:12px;margin-bottom:6px}
.tx.pending small{color:var(--warn)}
.tx.pending .meta b{white-space:normal}
.tx .acts{display:flex;gap:6px}
.ok-btn,.x-btn{width:32px;height:32px;border-radius:50%;border:0;display:grid;place-items:center}
.ok-btn{background:var(--lime-3);color:#fff}
.x-btn{background:#fff;border:1px solid var(--line-2);color:var(--ink)}
.ok-btn svg,.x-btn svg{width:14px;height:14px}
.tx-click{cursor:pointer}
.tx-click:hover .meta b{text-decoration:underline;text-decoration-color:var(--faint)}

/* Tables */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
.t th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.t td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t td.r,.t th.r{text-align:right}
.t tbody tr:hover{background:#fafbf9}
.t tfoot td{font-weight:500;border-top:1px solid var(--line-2)}
.empty{padding:34px 10px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}

/* Toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1}
.input,.select{border:1px solid var(--line-2);background:#fff;border-radius:var(--pill);padding:9px 14px;font-size:14px;min-width:0;outline:none}
.input:focus,.select:focus{border-color:var(--forest)}
.search{position:relative;flex:1;min-width:180px}
.search svg{position:absolute;left:13px;top:50%;width:15px;height:15px;transform:translateY(-50%);color:var(--muted)}
.search .input{width:100%;padding-left:36px}
.accts{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px;margin-bottom:16px}
.acct-chip{background:#fff;border-radius:var(--r-md);padding:12px 16px;min-width:160px;border:1.5px solid transparent;text-align:left}
.acct-chip.on{border-color:var(--forest)}
.acct-chip small{display:block;color:var(--muted);font-size:12px}
.acct-chip b{font-weight:500;font-size:17px}

/* Progress list items (targets/goals/debts) */
.prog{padding:16px 0;border-bottom:1px solid var(--line)}
.prog:last-child{border-bottom:0}
.prog .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.prog .top b{font-weight:500}
.prog .sub{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:7px;gap:8px;flex-wrap:wrap}
.prog .bar{height:8px}
.goal-card{display:flex;flex-direction:column;gap:10px}
.ring{width:64px;height:64px;flex:none}
.stat{background:#fff;border-radius:var(--r-lg);padding:18px 20px}
.stat small{color:var(--muted);font-size:12.5px;display:block}
.stat b{font-size:26px;font-weight:500;letter-spacing:-.02em;display:block;margin-top:4px}
.stat em{font-style:normal;font-size:12px}

/* Chart */
.chart{width:100%;height:220px;display:block}
.chart text{font-size:11px;fill:var(--muted);font-family:var(--font)}
.chart .gridl{stroke:var(--line);stroke-width:1}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:#fff;border-radius:10px;padding:8px 11px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:none;line-height:1.5}
.tip b{font-weight:500}
.kv{display:grid;grid-template-columns:1fr auto;gap:9px 14px;font-size:14px}
.kv span{color:var(--muted)}
.kv .sep{border-top:1px solid var(--line);padding-top:9px}

/* Subnav (tools) */
.subnav{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px}
.subnav button{border:0;background:#fff;padding:9px 16px;border-radius:var(--pill);font-size:14px;color:var(--ink-2);white-space:nowrap}
.subnav button.on{background:var(--ink);color:#fff}

/* Notice */
.note{background:#fff;border:1px dashed var(--line-2);border-radius:var(--r-md);padding:12px 14px;font-size:13px;color:var(--ink-2)}

/* Modal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(18,24,16,.36);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:var(--r-lg);width:min(560px,100%);max-height:calc(100dvh - 36px);overflow:auto;padding:24px;animation:rise .18s ease}
.modal.wide{width:min(820px,100%)}
@keyframes rise{from{transform:translateY(10px);opacity:0}}
.modal h3{margin:0 0 4px;font-size:21px;font-weight:500;letter-spacing:-.01em}
.modal .lead{color:var(--muted);font-size:14px;margin:0 0 16px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:12.5px;color:var(--ink-2);font-weight:500}
.f input,.f select,.f textarea{border:1px solid var(--line-2);border-radius:var(--r-sm);padding:11px 12px;background:#fff;width:100%;outline:none;min-height:44px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--forest);box-shadow:0 0 0 3px var(--lime-soft)}
.f textarea{min-height:72px;resize:vertical}
.f .hint{font-size:12px;color:var(--muted)}
.type-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--chip);padding:4px;border-radius:var(--r-md)}
.type-seg button{border:0;background:transparent;padding:9px;border-radius:12px;font-weight:500;font-size:14px;color:var(--ink-2)}
.type-seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.modal-actions .left{margin-right:auto}
.lines{width:100%;border-collapse:collapse;font-size:14px}
.lines td{padding:4px 4px 4px 0}
.lines input{border:1px solid var(--line-2);border-radius:10px;padding:9px 10px;width:100%;min-height:40px}
.lines .x{border:0;background:none;color:var(--muted);font-size:18px;padding:4px 8px}

/* Menu popover */
.menu{position:fixed;z-index:55;background:#fff;border-radius:var(--r-md);box-shadow:0 16px 40px rgba(20,30,20,.18);padding:6px;min-width:200px;animation:fade .12s}
.menu button{display:flex;width:100%;border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;font-size:14px;gap:10px;align-items:center}
.menu button:hover{background:var(--chip)}
.menu button.d{color:var(--neg)}
.menu .sep{height:1px;background:var(--line);margin:4px 6px}
.notif{width:min(380px,calc(100vw - 24px));max-height:70vh;overflow:auto;padding:10px}
.notif h4{margin:6px 8px 8px;font-weight:500}
.notif .item{display:flex;gap:10px;padding:10px;border-radius:12px;align-items:flex-start;cursor:pointer}
.notif .item:hover{background:var(--chip)}
.notif .item i{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.notif .item small{display:block;color:var(--muted)}

/* Command search */
.cmd{width:min(620px,100%);padding:0;overflow:hidden}
.cmd .search{margin:0}
.cmd .search .input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:18px 18px 18px 46px;font-size:16px}
.cmd .search svg{left:18px}
.cmd .res{max-height:60vh;overflow:auto;padding:6px}
.cmd .res button{display:flex;width:100%;justify-content:space-between;gap:10px;border:0;background:none;padding:11px 12px;border-radius:12px;text-align:left}
.cmd .res button:hover,.cmd .res button.sel{background:var(--chip)}
.cmd .res small{color:var(--muted)}

/* Toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:70;background:var(--ink);color:#fff;padding:11px 16px;border-radius:var(--pill);font-size:14px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:rise .18s}
.toast button{border:0;background:none;color:var(--lime);font-weight:500}

/* Auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr;background:var(--canvas)}
.auth-art{background:var(--lime);margin:16px;border-radius:var(--r-xl);padding:40px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;color:var(--lime-ink)}
.auth-art .star{position:absolute;right:-60px;bottom:-60px;width:380px;height:380px;color:var(--lime-3);opacity:.6}
.auth-art h2{font-size:clamp(32px,4vw,48px);font-weight:500;letter-spacing:-.03em;line-height:1.05;margin:0;max-width:460px}
.auth-art p{max-width:400px;font-size:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:20px;letter-spacing:-.01em}
.brand i{width:36px;height:36px;border-radius:11px;background:var(--forest);color:var(--lime);display:grid;place-items:center}
.brand i svg{width:20px;height:20px}
.mini-cards{display:flex;gap:10px;flex-wrap:wrap;position:relative}
.mini-cards div{background:rgba(255,255,255,.45);border-radius:16px;padding:12px 14px;font-size:13px}
.mini-cards b{display:block;font-size:20px;font-weight:500}
.auth-form{display:flex;align-items:center;justify-content:center;padding:32px 22px}
.auth-box{width:min(420px,100%)}
.auth-box h1{font-size:30px;font-weight:500;letter-spacing:-.02em;margin:0 0 6px}
.auth-box > p{color:var(--muted);margin:0 0 22px}
.ws{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.ws button{border:1.5px solid var(--line-2);background:#fff;border-radius:var(--r-md);padding:14px;text-align:left;display:flex;flex-direction:column;gap:3px}
.ws button b{font-weight:500}
.ws button small{color:var(--muted);font-size:12px;line-height:1.35}
.ws button.on{border-color:var(--forest);background:var(--lime-soft)}
.auth-box .f{margin-bottom:12px}
.err{color:var(--neg);font-size:13px;min-height:20px;margin:4px 0 8px}
.switch{text-align:center;margin-top:16px;font-size:14px;color:var(--muted)}
.switch button{border:0;background:none;color:var(--forest);font-weight:500;text-decoration:underline}

/* Invoice print */
.invoice-doc{font-size:14px;color:#111}
.invoice-doc .ih{display:flex;justify-content:space-between;gap:20px;margin-bottom:26px}
.invoice-doc h1{font-size:30px;font-weight:500;margin:0;letter-spacing:-.02em}
.invoice-doc table{width:100%;border-collapse:collapse;margin:18px 0}
.invoice-doc th{text-align:left;font-weight:500;font-size:12px;color:#666;border-bottom:1px solid #ddd;padding:8px 6px}
.invoice-doc td{padding:9px 6px;border-bottom:1px solid #eee}
.invoice-doc .r{text-align:right}
.invoice-doc .totals{margin-left:auto;width:260px}
.invoice-doc .totals div{display:flex;justify-content:space-between;padding:4px 0}
.invoice-doc .totals .grand{border-top:1px solid #ccc;font-weight:600;font-size:16px;padding-top:8px;margin-top:4px}

/* Responsive */
@media (max-width:1060px){
  .topbar{grid-template-columns:1fr auto}
  .topbar .nav{grid-column:1/-1;grid-row:2;overflow-x:auto;justify-content:flex-start}
  .g-3{grid-template-columns:1fr 1fr}
  .g-3 > :last-child{grid-column:1/-1}
}
@media (max-width:820px){
  .shell{margin:0;border-radius:0;padding:16px 14px 96px;min-height:100vh}
  .g-hero,.g-2,.g-3{grid-template-columns:minmax(0,1fr)}
  .g-3 > :last-child{grid-column:auto}
  .g-4{grid-template-columns:1fr 1fr}
  .topbar{padding-bottom:16px}
  .topbar .nav{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-radius:var(--pill);padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.14);justify-content:space-between;grid-row:auto}
  .nav a{padding:9px 12px;font-size:13px;flex:1;text-align:center}
  .hello h1{font-size:21px}
  .live span{display:none}
  .auth{grid-template-columns:1fr}
  .auth-art{min-height:auto;padding:26px;gap:18px}
  .auth-art .mini-cards{display:none}
  .form{grid-template-columns:1fr}
  .card{padding:18px;border-radius:20px}
  .hero{min-height:0}
  .fab{width:52px;height:52px}
}
@media (max-width:420px){ .g-4{grid-template-columns:1fr} .tiles{grid-template-columns:1fr 1fr} .hero-actions .btn{flex:1;justify-content:center} .fab{display:none} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff}
  body > *:not(.overlay){display:none!important}
  .overlay{position:static;background:none;backdrop-filter:none;padding:0}
  .modal{box-shadow:none;max-height:none;width:100%;padding:0}
  .no-print{display:none!important}
}

/* Brand logo */

/* Fundly — core: utilities, on-device storage, calculations, migration */
'use strict';

/* ---------- utilities ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p = '') => p + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const round2 = n => Math.round((Number(n) || 0) * 100) / 100;
const num = v => { const n = Number(String(v ?? '').replace(/[, ]/g, '')); return Number.isFinite(n) ? n : 0; };
const pad = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoDate(new Date());

/* ---------- store: in memory, saved to this browser, synced between open tabs ---------- */
const ARRAYS = ['accounts', 'categories', 'tx', 'invoices', 'clients', 'goals', 'debts', 'recurring', 'compliance'];
const OBJECTS = ['settings', 'tax'];
const KEYS = [...ARRAYS, ...OBJECTS];
const Store = {
  d: {}, pid: null, dirty: new Set(), timer: null, online: true, listeners: [],
  reset() { this.d = {}; this.dirty.clear(); KEYS.forEach(k => this.d[k] = ARRAYS.includes(k) ? [] : {}); },
  load() { KEYS.forEach(k => { const v = LS.get(API.pk(k)); if (v !== null && v !== undefined) this.d[k] = v; }); },
  exists() { return localStorage.getItem(API.pk('settings')) !== null; },
  onChange(fn) { this.listeners.push(fn); },
  emit(remote) { this.listeners.forEach(f => f(remote)); },
  get(k, id) { return this.d[k].find(x => x.id === id); },
  upsert(k, rec, { silent } = {}) {
    rec.updatedAt = Date.now(); if (!rec.createdAt) rec.createdAt = rec.updatedAt;
    const i = this.d[k].findIndex(x => x.id === rec.id); if (i >= 0) this.d[k][i] = rec; else this.d[k].push(rec);

  remove(k, id) { this.d[k] = this.d[k].filter(x => x.id !== id); this.dirty.add(k); this.schedule(); this.emit(false); },
  patch(k, patch) { Object.assign(this.d[k], patch); this.dirty.add(k); this.schedule(); this.emit(false); },
  replaceAll(k, value) { this.d[k] = value; this.dirty.add(k); this.schedule(); },
  schedule() { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 150); },
  flush() { clearTimeout(this.timer); if (!this.pid) return Promise.resolve(); let ok = true; this.dirty.forEach(k => { ok = LS.set(API.pk(k), this.d[k]) && ok; }); if (ok) { this.dirty.clear(); UI.pulse(); } return Promise.resolve(); },

Store.reset();
// Another tab on this device changed something → pick it up instantly.

/* ---------- money formatting & display currency ---------- */
const Fmt = {
  display: null, // code currently displayed

  rate() { const code = this.display || this.base(); if (code === this.base()) return 1; const c = (D.settings.display || []).find(x => x.code === code); return c && c.rate > 0 ? c.rate : 1; },
  code() { return this.display && (D.settings.display || []).some(x => x.code === this.display) ? this.display : this.base(); },
  money(n, { sign = false, raw = false, compact = false } = {}) {
    if (this.hidden && !raw) return '••••••';

    let s;
    try { s = new Intl.NumberFormat('en-US', { style: 'currency', currency: code, ...(compact ? { notation: 'compact', maximumFractionDigits: 1 } : { minimumFractionDigits: 2, maximumFractionDigits: 2 }) }).format(Math.abs(v)); }
    catch (e) { s = code + ' ' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

const money = (n, o) => Fmt.money(n, o);

/* ---------- domain calculations ---------- */
const Calc = {
  biz() { return App.user && App.user.workspace === 'business'; },
  cleared: t => t.status === 'cleared',
  cat(id) { return D.categories.find(c => c.id === id) || { id, name: 'Uncategorised', kind: 'expense' }; },
  acct(id) { return D.accounts.find(a => a.id === id) || D.accounts[0] || { id: '', name: 'Account' }; },
  signed(t) { return t.type === 'income' ? t.amount : -t.amount; },
  acctBalance(id) { const a = D.accounts.find(x => x.id === id); return round2((a ? num(a.opening) : 0) + sum(D.tx.filter(t => t.accountId === id && this.cleared(t)), t => this.signed(t))); },
  balance() { return round2(sum(D.accounts, a => num(a.opening)) + sum(D.tx.filter(this.cleared), t => this.signed(t))); },
  pending() { const p = D.tx.filter(t => t.status === 'pending'); return { in: sum(p.filter(t => t.type === 'income'), t => t.amount), out: sum(p.filter(t => t.type !== 'income'), t => t.amount), count: p.length }; },
  month(ym, filter = () => true) {
    const ts = D.tx.filter(t => this.cleared(t) && monthOf(t.date) === ym && filter(t));
    const r = { income: 0, expense: 0, saving: 0, inc: {}, exp: {} };
    ts.forEach(t => { if (t.type === 'income') { r.income += t.amount; r.inc[t.categoryId] = (r.inc[t.categoryId] || 0) + t.amount; } else if (t.type === 'expense') { r.expense += t.amount; r.exp[t.categoryId] = (r.exp[t.categoryId] || 0) + t.amount; } else r.saving += t.amount; });
    r.net = r.income - r.expense - r.saving; return r;
  },
  range(from, to) { return D.tx.filter(t => this.cleared(t) && t.date >= from && t.date <= to); },
  inv(i) {
    const sub = round2(sum(i.lines || [], l => num(l.q) * num(l.p)));
    const vat = round2(sub * num(i.vatRate) / 100), total = round2(sub + vat);
    const pays = D.tx.filter(t => t.invoiceId === i.id && t.type === 'income');
    const paid = round2(sum(pays.filter(this.cleared), t => t.amount)), pendingPay = round2(sum(pays.filter(t => t.status === 'pending'), t => t.amount));
    let status = i.status || 'draft';
    if (i.kind === 'quote') { /* stored */ }
    else if (status === 'void') { }
    else if (total > 0 && paid >= total - 0.005) status = 'paid';
    else if (paid > 0) status = (i.due && i.due < today()) ? 'overdue' : 'part-paid';
    else if (status !== 'draft' && i.due && i.due < today()) status = 'overdue';

  },
  receivables() {
    const open = D.invoices.filter(i => i.kind !== 'quote').map(i => ({ i, c: this.inv(i) })).filter(x => x.c.due > 0 && x.c.status !== 'draft');
    return { open, total: sum(open, x => x.c.due), overdue: sum(open.filter(x => x.c.status === 'overdue'), x => x.c.due), overdueCount: open.filter(x => x.c.status === 'overdue').length };
  },
  debt(d) { const paid = round2(num(d.opening) + sum(D.tx.filter(t => t.debtId === d.id && this.cleared(t)), t => t.amount)); return { paid, left: Math.max(0, round2(num(d.owed) - paid)), pct: Math.min(100, pct(paid, num(d.owed))) }; },
  goal(g) {
    const saved = round2(num(g.opening) + sum(D.tx.filter(t => t.goalId === g.id && this.cleared(t)), t => t.type === 'income' ? -t.amount : t.amount));

  activeMonths() { const s = new Set(D.tx.map(t => monthOf(t.date)).filter(Boolean)); s.add(thisMonth()); return [...s].sort().reverse(); },

/* ---------- recurring payments → pending transactions ---------- */
const Recurring = {
  step(date, freq) {
    const d = new Date(date + 'T12:00:00');
    if (freq === 'weekly') d.setDate(d.getDate() + 7);
    else if (freq === 'quarterly') d.setMonth(d.getMonth() + 3);
    else if (freq === 'yearly') d.setFullYear(d.getFullYear() + 1);
    else d.setMonth(d.getMonth() + 1);
    return isoDate(d);
  },
  run() {
    const t = today(); let made = 0;
    for (const r of D.recurring) {
      if (!r.active || !r.next) continue; let next = r.next, guard = 0;
      while (next <= t && guard++ < 60) {
        const id = `r_${r.id}_${next}`;
        if (!D.tx.some(x => x.id === id)) { Store.upsert('tx', { id, type: r.type, amount: round2(r.amount), date: next, categoryId: r.categoryId, accountId: r.accountId, party: r.label, note: 'Recurring · ' + r.freq, status: 'pending', recurringId: r.id }, { silent: true }); made++; }
        next = this.step(next, r.freq);
      }
      if (next !== r.next) Store.upsert('recurring', { ...r, next }, { silent: true });
    }
    return made;
  },
};

const Migrate = {
  /** Converts Fundly 1 records (stored as legacy keys) into Fundly 2 collections. Legacy keys are left untouched. */
  run(legacy, biz) {
    const out = { notes: [] };
    const L = k => legacy[k];
    const s1 = L('meda-finance-settings') || {};
    const settings = Defaults.settings(biz);
    settings.name = (biz ? s1.businessName : s1.household) || '';
    if (s1.currency) settings.currency = s1.currency;
    settings.onboarded = !!settings.name;
    const cats = Defaults.categories(biz), tx = [], debts = [], goals = [], invoices = [], clients = [], compliance = [];
    const catByName = name => { const n = String(name || 'Other').trim(); let c = cats.find(x => x.name.toLowerCase() === n.toLowerCase()); if (!c) { c = { id: uid('c_'), name: n, kind: 'expense', budget: 0 }; cats.push(c); } return c; };
    const p1 = L('household-finance-local-v1');
    if (p1 && typeof p1 === 'object') {
      (p1.debts || []).forEach(d => debts.push({ id: uid('d_'), name: d.name, owed: num(d.owed), opening: num(d.paid), priority: d.priority === 'High' ? 'High' : 'Normal', due: '', notes: '' }));
      (p1.goals || []).forEach(g => goals.push({ id: uid('g_'), name: g.name, target: num(g.target), opening: num(g.saved), date: g.date || '', notes: g.notes || '' }));
      const months = Object.keys(p1.budgets || {}).sort();
      const latest = months.length ? p1.budgets[months[months.length - 1]] : null;
      if (latest) (latest.categories || []).filter(c => c.type !== 'savings').forEach(c => { const cc = catByName(c.name); if (num(c.planned) > 0) cc.budget = num(c.planned); });
      const incCat = cats.find(c => c.kind === 'income') || { id: 'c_other_income' };
      months.forEach(m => {
        const b = p1.budgets[m]; const date = m + '-01';
        if (num(b.incomeActual) > 0) tx.push({ id: uid('t_'), type: 'income', amount: round2(b.incomeActual), date, categoryId: incCat.id, accountId: 'a_bank', party: 'Income (Fundly 1)', note: 'Imported monthly total', status: 'cleared', imported: 'v1-budget' });
        (b.categories || []).forEach(c => { if (num(c.actual) <= 0) return; const isSav = c.type === 'savings'; tx.push({ id: uid('t_'), type: isSav ? 'saving' : 'expense', amount: round2(c.actual), date, categoryId: isSav ? '' : catByName(c.name).id, accountId: 'a_bank', party: c.name, note: 'Imported monthly total', status: 'cleared', imported: 'v1-budget' }); });
      });
      out.notes.push(`${debts.length} debts, ${goals.length} goals and ${months.length} budget month(s)`);
    }
    const b1 = L('financial-tracker-business-v1');
    if (Array.isArray(b1) && b1.length) {
      const clientId = name => { let c = clients.find(x => x.name.toLowerCase() === String(name).toLowerCase()); if (!c) { c = { id: uid('cl_'), name: String(name || 'Client'), email: '', phone: '', address: '' }; clients.push(c); } return c.id; };
      b1.forEach(r => {
        const quote = r.type === 'Quotation', id = uid('i_');
        const st = r.status === 'Voided' ? 'void' : quote ? (r.status === 'Accepted' ? 'accepted' : r.status === 'Declined' ? 'declined' : 'sent') : 'sent';
        invoices.push({ id, kind: quote ? 'quote' : 'invoice', number: r.ref || '', clientId: clientId(r.client), issue: r.issueDate || today(), due: r.dueDate || '', lines: [{ d: r.project || 'Services', q: 1, p: num(r.amount) }], vatRate: 0, notes: r.notes || '', status: st, imported: 'v1' });
        if (!quote && r.status === 'Paid') tx.push({ id: uid('t_'), type: 'income', amount: round2(r.amount), date: r.dueDate || r.issueDate || today(), categoryId: 'c_sales', accountId: 'a_bank', party: r.client, note: 'Payment for ' + (r.ref || 'invoice') + ' (imported)', status: 'cleared', invoiceId: id, imported: 'v1' });
      });
      out.notes.push(`${invoices.length} invoices/quotations and ${clients.length} clients`);
    }
    const c1 = L('fundly-biz-compliance-v1');
    if (Array.isArray(c1)) c1.forEach(x => compliance.push({ id: uid('o_'), title: x.type, period: x.period || '', due: x.due || '', owner: x.owner || '', status: /filed|paid/i.test(x.status) ? 'done' : /not applicable/i.test(x.status) ? 'na' : 'upcoming', ref: x.reference || '', notes: x.notes || '' }));
    const t1 = L('fundly-biz-tax-v1');
    const tax = t1 && typeof t1 === 'object' ? { tin: t1.tin || '', vatStatus: t1.vatStatus || 'not-registered', vatRate: t1.vatRate ?? '', citRate: t1.citRate ?? '', year: t1.year || '', verifiedBy: t1.verifiedBy || '', effective: t1.effective || '' } : {};
    const j1 = L('fundly-biz-ledger-v1'); if (Array.isArray(j1) && j1.length) out.notes.push(`${j1.length} journal entries kept in the Fundly 1 archive (Tools → Data)`);
    Object.assign(out, { settings, categories: cats, accounts: Defaults.accounts(biz), tx, debts, goals, invoices, clients, compliance, tax, recurring: [] });
    out.any = Object.keys(legacy).some(k => /household-finance|financial-tracker-business|fundly-biz/.test(k));
    return out;
  },
};

const UI = {
  toast(msg, { undo, ms = 3200 } = {}) {
    $$('.toast').forEach(t => t.remove());
    const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
    t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">Undo</button>' : ''}`;
    if (undo) t.querySelector('button').onclick = () => { undo(); t.remove(); };
    document.body.appendChild(t); setTimeout(() => t.remove(), undo ? 6000 : ms);
  },
  modal(html, { wide = false, cls = '', onClose } = {}) {
    const o = document.createElement('div'); o.className = 'overlay';
    o.innerHTML = `<div class="modal ${wide ? 'wide' : ''} ${cls}" role="dialog" aria-modal="true">${html}</div>`;
    const close = () => { o.remove(); document.removeEventListener('keydown', key); onClose && onClose(); };
    const key = e => { if (e.key === 'Escape') close(); };
    o.addEventListener('mousedown', e => { if (e.target === o) close(); });
    o.addEventListener('click', e => { if (e.target.closest('[data-close]')) close(); });
    document.addEventListener('keydown', key);
    document.body.appendChild(o);
    const first = o.querySelector('input:not([type=hidden]):not([readonly]),select,textarea'); if (first && matchMedia('(min-width:821px)').matches) setTimeout(() => first.focus(), 30);
    o.close = close; return o;
  },
  confirm(msg, { ok = 'Confirm', danger = false, detail = '' } = {}) {
    return new Promise(res => {
      let done = false;
      const m = UI.modal(`<h3>${esc(msg)}</h3>${detail ? `<p class="lead">${esc(detail)}</p>` : ''}<div class="modal-actions"><button class="btn soft" data-close>Cancel</button><button class="btn ${danger ? 'danger' : ''}" data-ok>${esc(ok)}</button></div>`, { onClose: () => { if (!done) res(false); } });
      m.querySelector('[data-ok]').onclick = () => { done = true; res(true); m.close(); };
    });
  },
  menu(anchor, items, { cls = '' } = {}) {
    $$('.menu').forEach(m => m.remove());
    const m = document.createElement('div'); m.className = 'menu ' + cls;
    if (typeof items === 'string') m.innerHTML = items;
    else items.forEach(it => {

      const b = document.createElement('button'); b.type = 'button'; b.className = it.danger ? 'd' : ''; b.textContent = it.label;
      b.onclick = () => { m.remove(); it.fn(); }; m.appendChild(b);
    });
    document.body.appendChild(m);
    const r = anchor.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
    let left = Math.min(window.innerWidth - w - 10, Math.max(10, r.right - w)); let top = r.bottom + 6; if (top + h > window.innerHeight - 10) top = Math.max(10, r.top - h - 6);
    m.style.left = left + 'px'; m.style.top = top + 'px';
    setTimeout(() => { const off = e => { if (!m.contains(e.target)) { m.remove(); document.removeEventListener('mousedown', off); } }; document.addEventListener('mousedown', off); }, 0);

/* ---------- backup / restore (the way to move data between devices) ---------- */
const Backup = {
  build() {
    const out = { product: 'Fundly', version: 2, profile: { name: App.user.username, workspace: App.user.workspace }, exportedAt: new Date().toISOString() };
    KEYS.forEach(k => out[k] = D[k]); out.audit = LS.get(API.pk('audit'), []);
    out.files = {}; D.tx.filter(t => t.fileId).forEach(t => { const f = LS.get(API.pk('file:' + t.fileId)); if (f) out.files[t.fileId] = f; });
    return out;
  },
  download() { const out = this.build(); download(`fundly-backup-${App.user.username.replace(/\W+/g, '-').toLowerCase()}-${today()}.json`, JSON.stringify(out), 'application/json'); Store.patch('settings', { lastBackup: today() }); API.audit('BACKUP_EXPORTED', 'Backup', 'JSON'); UI.toast('Backup downloaded — keep it somewhere safe'); },
  async restoreFile(file, asNewProfile) {
    if (!file) return; let d; try { d = JSON.parse(await file.text()); } catch (e) { return UI.toast('That file isn’t a valid backup'); }
    if (d.product !== 'Fundly' || d.version !== 2) return UI.toast('That isn’t a Fundly backup file');
    if (asNewProfile || !App.user) {
      const p = Profiles.create((d.profile && d.profile.name) || 'Restored', (d.profile && d.profile.workspace) || 'business', '');
      Store.pid = p.id; KEYS.forEach(k => { if (d[k] !== undefined) LS.set(API.pk(k), d[k]); }); if (d.audit) LS.set(API.pk('audit'), d.audit);
      Object.entries(d.files || {}).forEach(([id, f]) => LS.set(API.pk('file:' + id), f));
      App.start(p); API.audit('BACKUP_RESTORED', 'Backup', String(d.exportedAt)); UI.toast('Backup restored'); return;
    }
    if (!(await UI.confirm('Replace this profile’s data with the backup?', { ok: 'Restore', danger: true, detail: `Backup from ${String(d.exportedAt || '').slice(0, 10)}. Current records in this profile will be overwritten.` }))) return;
    KEYS.forEach(k => { if (d[k] !== undefined) Store.replaceAll(k, d[k]); }); Object.entries(d.files || {}).forEach(([id, f]) => LS.set(API.pk('file:' + id), f));
    Store.flush(); Store.emit(false); API.audit('BACKUP_RESTORED', 'Backup', String(d.exportedAt)); UI.toast('Backup restored');
  },
};

/* ---------- notifications ---------- */
const Notify = {
  items() {
    const out = [], t = today();
    const pend = D.tx.filter(x => x.status === 'pending');
    const due = pend.filter(x => x.date <= t);
    if (due.length) out.push({ c: 'var(--warn)', t: `${due.length} payment${due.length > 1 ? 's' : ''} to confirm`, s: due.slice(0, 2).map(x => `${x.party} ${money(x.amount)}`).join(' · '), go: 'money' });
    if (Calc.biz()) {
      D.invoices.filter(i => i.kind !== 'quote').forEach(i => { const c = Calc.inv(i); const cl = Views.clientName(i);
        if (c.status === 'overdue') out.push({ c: 'var(--neg)', t: `${i.number || 'Invoice'} is ${c.overdueDays} day${c.overdueDays === 1 ? '' : 's'} overdue`, s: `${cl} owes ${money(c.due)}`, go: 'invoices' });
        else if (c.due > 0 && i.status !== 'draft' && i.due && daysBetween(t, i.due) >= 0 && daysBetween(t, i.due) <= 3) out.push({ c: 'var(--warn)', t: `${i.number} due ${fmtDate(i.due).toLowerCase()}`, s: `${cl} · ${money(c.due)}`, go: 'invoices' }); });
      D.compliance.filter(o => o.status === 'upcoming' && o.due).forEach(o => { const d = daysBetween(t, o.due); if (d <= 14) out.push({ c: d < 0 ? 'var(--neg)' : 'var(--warn)', t: `${o.title}${o.period ? ' · ' + o.period : ''}`, s: d < 0 ? `Overdue by ${-d} day(s)` : d === 0 ? 'Due today' : `Due in ${d} day(s)`, go: 'tools/tax' }); });
    }
    Calc.budgets().filter(b => b.pct >= 90).forEach(b => out.push({ c: b.pct > 100 ? 'var(--neg)' : 'var(--warn)', t: `${b.c.name} at ${Math.round(b.pct)}% of limit`, s: `${money(b.spent)} of ${money(b.limit)} this month`, go: 'targets' }));
    const lb = D.settings.lastBackup; if (D.tx.length >= 5 && (!lb || daysBetween(lb, t) > 14)) out.push({ c: 'var(--warn)', t: lb ? `Last backup was ${daysBetween(lb, t)} days ago` : 'You haven’t backed up yet', s: 'Your records live only in this browser — download a backup', go: 'tools/data' });
    D.goals.forEach(g => { const c = Calc.goal(g); if (c.late) out.push({ c: 'var(--warn)', t: `${g.name} passed its target date`, s: `${money(c.left)} still to save`, go: 'targets' }); });
    return out;
  },
  badge() { const n = this.items().length; const b = $('#bellCount'); if (b) { b.textContent = n; $('#btnBell').classList.toggle('has', n > 0); } },
  open(anchor) {
    const items = this.items();
    const m = UI.menu(anchor, `<h4>Needs attention</h4>${items.length ? items.map((x, i) => `<div class="item" data-i="${i}"><i style="background:${x.c}"></i><div><b style="font-weight:500">${esc(x.t)}</b><small>${esc(x.s)}</small></div></div>`).join('') : '<div class="empty"><b>All clear</b>Nothing needs your attention right now.</div>'}`, { cls: 'notif' });
    $$('.item', m).forEach(el => el.onclick = () => { m.remove(); App.go(items[el.dataset.i].go); });
  },
};

/* ---------- search (Ctrl+K) ---------- */
const Search = {
  open() {
    const m = UI.modal(`<div class="search">${I.search}<input class="input" id="q" placeholder="Search payments, invoices, clients, goals…" autocomplete="off"></div><div class="res" id="qr"></div>`, { cls: 'cmd' });
    const q = $('#q', m), out = $('#qr', m); let sel = 0, res = [];
    const pages = NAV[App.user.workspace].map(([k, l]) => ({ l: 'Go to ' + l, s: 'Page', fn: () => App.go(k) }));
    const run = () => {
      const s = q.value.trim().toLowerCase(); res = [];
      if (!s) res = pages.concat([{ l: 'Record a payment', s: 'Action', fn: () => Forms.tx({ type: 'expense' }) }, { l: 'Record money received', s: 'Action', fn: () => Forms.tx({ type: 'income' }) }]);
      else {
        D.tx.filter(t => `${t.party} ${t.note} ${Calc.cat(t.categoryId).name} ${t.amount}`.toLowerCase().includes(s)).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 8)
          .forEach(t => res.push({ l: `${t.party || Calc.cat(t.categoryId).name} · ${money(t.type === 'income' ? t.amount : -t.amount, { sign: true })}`, s: fmtDate(t.date) + ' · ' + Calc.cat(t.categoryId).name, fn: () => Forms.tx({ tx: t }) }));
        D.invoices.filter(i => `${i.number} ${Views.clientName(i)} ${(i.lines || []).map(l => l.d).join(' ')}`.toLowerCase().includes(s)).slice(0, 6)
          .forEach(i => res.push({ l: `${i.number} · ${Views.clientName(i)}`, s: (i.kind === 'quote' ? 'Quotation' : 'Invoice') + ' · ' + money(Calc.inv(i).total), fn: () => Views.viewInvoice(i.id) }));
        D.clients.filter(c => c.name.toLowerCase().includes(s)).slice(0, 4).forEach(c => res.push({ l: c.name, s: 'Client', fn: () => Forms.client(c) }));
        D.goals.filter(g => g.name.toLowerCase().includes(s)).forEach(g => res.push({ l: g.name, s: 'Savings goal', fn: () => Forms.goal(g) }));
        D.debts.filter(g => g.name.toLowerCase().includes(s)).forEach(g => res.push({ l: g.name, s: 'Debt', fn: () => Forms.debt(g) }));
        pages.filter(p => p.l.toLowerCase().includes(s)).forEach(p => res.push(p));
      }
      sel = 0; out.innerHTML = res.length ? res.map((r, i) => `<button type="button" data-i="${i}" class="${i === 0 ? 'sel' : ''}"><span>${esc(r.l)}</span><small>${esc(r.s)}</small></button>`).join('') : '<div class="empty">No matches</div>';
      $$('button', out).forEach(b => b.onclick = () => { m.close(); res[b.dataset.i].fn(); });
    };
    q.oninput = run; run(); setTimeout(() => q.focus(), 20);
    q.onkeydown = e => {
      const bs = $$('button', out);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + bs.length) % bs.length; bs.forEach((b, i) => b.classList.toggle('sel', i === sel)); bs[sel] && bs[sel].scrollIntoView({ block: 'nearest' }); }
      if (e.key === 'Enter' && res[sel]) { m.close(); res[sel].fn(); }
    };
  },
};

/* ---------- forms ---------- */
const Forms = {
  catOpts(kind, sel) { return UI.opts(D.categories.filter(c => c.kind === kind).map(c => ({ value: c.id, label: c.name })), sel); },
  acctOpts(sel) { return UI.opts(D.accounts.map(a => ({ value: a.id, label: a.name })), sel); },
  parties() { const s = new Set([...D.tx.map(t => t.party), ...D.clients.map(c => c.name)].filter(Boolean)); return [...s].slice(-200).map(p => `<option value="${esc(p)}">`).join(''); },

  /** Record / edit a transaction. opts: {tx, type, status, amount, party, invoiceId, debtId, goalId, categoryId} */
  tx(opts = {}) {
    const ex = opts.tx; const t = ex ? { ...ex } : { id: uid('t_'), type: opts.type || 'expense', amount: opts.amount || '', date: today(), party: opts.party || '', categoryId: opts.categoryId || '', accountId: (D.accounts[0] || {}).id, status: opts.status || 'cleared', note: opts.note || '', invoiceId: opts.invoiceId || '', debtId: opts.debtId || '', goalId: opts.goalId || '', vat: '' };
    const biz = Calc.biz();
    const m = UI.modal(`<h3>${ex ? 'Edit transaction' : opts.title || 'Record a payment'}</h3><p class="lead">${ex ? 'Changes sync to all your devices instantly.' : 'Pending items wait in your feed until you confirm they’ve cleared.'}</p>
      <form id="txf" autocomplete="off">
        <div class="type-seg" style="margin-bottom:14px">${[['income', 'Money in'], ['expense', 'Money out'], ['saving', 'To savings']].map(([k, l]) => `<button type="button" data-t="${k}" class="${t.type === k ? 'on' : ''}">${l}</button>`).join('')}</div>
        <div class="form">
          <div class="f"><label>Amount (${esc(Fmt.base())})</label><input name="amount" inputmode="decimal" required value="${esc(t.amount)}" placeholder="0.00"></div>
          <div class="f"><label>Date</label><input name="date" type="date" required value="${esc(t.date)}"></div>
          <div class="f full"><label id="partyL">Description</label><input name="party" list="partyList" value="${esc(t.party)}" placeholder="e.g. Rent, client name, supplier"><datalist id="partyList">${this.parties()}</datalist></div>
          <div class="f" id="catF"><label>Category</label><select name="categoryId"></select></div>
          <div class="f hidden" id="goalF"><label>Savings goal</label><select name="goalId">${UI.opts(D.goals.map(g => ({ value: g.id, label: g.name })), t.goalId, { blank: 'General savings' })}</select></div>
          <div class="f"><label>Account</label><select name="accountId">${this.acctOpts(t.accountId)}</select></div>
          <div class="f"><label>Status</label><select name="status">${UI.opts([{ value: 'cleared', label: 'Cleared — money has moved' }, { value: 'pending', label: 'Pending — awaiting confirmation' }], t.status)}</select></div>
          <div class="f hidden" id="invF"><label>Payment for invoice</label><select name="invoiceId">${UI.opts(D.invoices.filter(i => i.kind !== 'quote' && (Calc.inv(i).due > 0 || i.id === t.invoiceId)).map(i => ({ value: i.id, label: `${i.number} · ${Views.clientName(i)} · ${money(Calc.inv(i).due, { raw: true })} due` })), t.invoiceId, { blank: 'Not linked' })}</select></div>
          <div class="f hidden" id="debtF"><label>Repays debt</label><select name="debtId">${UI.opts(D.debts.map(d => ({ value: d.id, label: `${d.name} · ${money(Calc.debt(d).left, { raw: true })} left` })), t.debtId, { blank: 'Not linked' })}</select></div>
          ${biz ? `<div class="f" id="vatF"><label>VAT included (optional)</label><input name="vat" inputmode="decimal" value="${esc(t.vat || '')}" placeholder="0.00"></div>` : ''}
          <div class="f full"><label>Note</label><input name="note" value="${esc(t.note)}" placeholder="Optional reference, receipt no., etc."></div>
          <div class="f full"><label>Receipt / proof of payment ${t.fileId ? `· <a href="#" id="dlFile">${esc(t.fileName || 'download')}</a>` : ''}</label><input type="file" name="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.heic"><span class="hint">Photos are shrunk automatically. PDFs up to 600 KB.</span></div>
        </div>
        <div class="modal-actions">${ex ? '<button type="button" class="btn danger left" id="txDel">Delete</button>' : ''}<button type="button" class="btn soft" data-close>Cancel</button><button class="btn">${ex ? 'Save changes' : 'Save'}</button></div>
      </form>`);
    const f = $('#txf', m);
    const sync = () => {
      const ty = t.type; $$('.type-seg button', m).forEach(b => b.classList.toggle('on', b.dataset.t === ty));
      $('#catF', m).classList.toggle('hidden', ty === 'saving'); $('#goalF', m).classList.toggle('hidden', ty !== 'saving');
      $('#invF', m).classList.toggle('hidden', !(ty === 'income' && D.invoices.length));
      $('#debtF', m).classList.toggle('hidden', !(ty === 'expense' && D.debts.length));
      $('#partyL', m).textContent = ty === 'income' ? 'Received from' : ty === 'expense' ? 'Paid to' : 'Description';
      const cs = f.categoryId, cur = cs.value || t.categoryId; cs.innerHTML = this.catOpts(ty === 'income' ? 'income' : 'expense', cur);
      if (!cs.value && cs.options.length) cs.selectedIndex = 0;
    };
    sync();
    $$('.type-seg button', m).forEach(b => b.onclick = () => { t.type = b.dataset.t; f.categoryId.value = ''; sync(); });
    f.invoiceId.onchange = () => { const i = D.invoices.find(x => x.id === f.invoiceId.value); if (i) { if (!num(f.amount.value)) f.amount.value = Calc.inv(i).due; if (!f.party.value) f.party.value = Views.clientName(i); } };
    f.debtId.onchange = () => { const d = D.debts.find(x => x.id === f.debtId.value); if (d) { if (!f.party.value) f.party.value = d.name; const dc = D.categories.find(c => /debt/i.test(c.name)); if (dc) f.categoryId.value = dc.id; } };
    if (t.fileId) $('#dlFile', m).onclick = async e => { e.preventDefault(); try { const r = await API.get('v2:file:' + t.fileId); if (r.item) { const a = document.createElement('a'); a.href = r.item.data.data; a.download = r.item.data.name; a.click(); } } catch (er) { UI.toast(er.message); } };
    if (ex) $('#txDel', m).onclick = async () => { if (await UI.confirm('Delete this transaction?', { ok: 'Delete', danger: true, detail: `${t.party || ''} · ${money(t.amount, { raw: true })}` })) { Store.remove('tx', t.id); API.audit('TX_DELETED', t.party || t.id, `${t.type} ${t.amount} on ${t.date}`); m.close(); UI.toast('Transaction deleted', { undo: () => Store.upsert('tx', ex) }); } };
    f.onsubmit = async e => {
      e.preventDefault(); const v = UI.form(f); const amount = round2(num(v.amount));
      if (!(amount > 0)) { f.amount.focus(); return UI.toast('Enter an amount greater than zero'); }
      const rec = { ...t, type: t.type, amount, date: v.date || today(), party: v.party.trim(), note: v.note.trim(), accountId: v.accountId, status: v.status,
        categoryId: t.type === 'saving' ? '' : v.categoryId, goalId: t.type === 'saving' ? v.goalId : '', invoiceId: t.type === 'income' ? v.invoiceId : '', debtId: t.type === 'expense' ? v.debtId : '', vat: biz ? round2(num(v.vat)) || '' : '', by: App.user.username };
      if (!rec.party) rec.party = t.type === 'saving' ? (D.goals.find(g => g.id === rec.goalId) || {}).name || 'Savings' : Calc.cat(rec.categoryId).name;
      const file = f.file.files[0];
      if (file) {
        let data;

      }
      Store.upsert('tx', rec); m.close();
      API.audit(ex ? 'TX_UPDATED' : 'TX_RECORDED', rec.party, `${rec.type} ${rec.amount} ${rec.status} on ${rec.date}${rec.invoiceId ? ' for invoice' : ''}`);
      UI.toast(ex ? 'Saved' : rec.status === 'pending' ? 'Added to pending payments' : 'Payment recorded', ex ? {} : { undo: () => Store.remove('tx', rec.id) });
    };
  },

  async confirmTx(t, ok) {
    if (ok) { Store.upsert('tx', { ...t, status: 'cleared', date: t.date > today() ? today() : t.date, confirmedAt: Date.now() }); API.audit('PAYMENT_CONFIRMED', t.party, `${t.type} ${t.amount}`); UI.toast('Payment confirmed', { undo: () => Store.upsert('tx', t) }); }
    else { Store.remove('tx', t.id); API.audit('PAYMENT_DISMISSED', t.party, `${t.type} ${t.amount}`); UI.toast('Pending payment dismissed', { undo: () => Store.upsert('tx', t) }); }
  },

  invoice(inv, kind = 'invoice') {
    const ex = !!inv; const s = D.settings;
    const i = ex ? JSON.parse(JSON.stringify(inv)) : { id: uid('i_'), kind, number: '', clientId: '', issue: today(), due: addDays(today(), num(s.payTerms) || 14), lines: [{ d: '', q: 1, p: '' }], vatRate: num(s.vatDefault), notes: '', status: kind === 'quote' ? 'draft' : 'sent' };

    const nextNo = () => (q ? s.quotePrefix || 'QT-' : s.invoicePrefix || 'INV-') + String(q ? s.nextQuote || 1 : s.nextInvoice || 1).padStart(4, '0');
    const client = D.clients.find(c => c.id === i.clientId);
    const m = UI.modal(`<h3>${ex ? 'Edit' : 'New'} ${q ? 'quotation' : 'invoice'}</h3><p class="lead">${q ? 'Send a quote, then convert it to an invoice once accepted.' : 'Record payments against it and Fundly tracks what’s still owed.'}</p>

        <div class="f"><label>${q ? 'Quote' : 'Invoice'} number</label><input name="number" value="${esc(i.number || nextNo())}"></div>

        <div class="f"><label>VAT %</label><input name="vatRate" inputmode="decimal" value="${esc(i.vatRate || '')}" placeholder="0"></div>
        <div class="f"><label>Status</label><select name="status">${UI.opts(q ? [{ value: 'draft', label: 'Draft' }, { value: 'sent', label: 'Sent' }, { value: 'accepted', label: 'Accepted' }, { value: 'declined', label: 'Declined' }] : [{ value: 'draft', label: 'Draft — not sent yet' }, { value: 'sent', label: 'Sent — awaiting payment' }], i.status === 'void' ? 'sent' : i.status)}</select></div>
        <div class="f full"><label>Notes</label><textarea name="notes" placeholder="Payment terms, bank / EcoCash details, thank-you note…">${esc(i.notes)}</textarea></div>

      const ix = n => head.findIndex(h => h === n || h.startsWith(n)); const di = ix('date'), de = ix('desc') >= 0 ? ix('desc') : ix('party'), am = ix('amount'), ca = ix('categ'), ac = ix('account'), st = ix('status');
      if (di < 0 || am < 0) { $('#csvPrev', m).textContent = 'Couldn’t find “date” and “amount” columns.'; return; }

      rows = data.map(r => { const amt = num(r[am]); const type = amt < 0 ? 'expense' : 'income'; const cname = ca >= 0 ? r[ca] : ''; let cat = D.categories.find(c => c.name.toLowerCase() === String(cname).trim().toLowerCase() && c.kind === type) || D.categories.find(c => c.kind === type && /other/i.test(c.name)) || D.categories.find(c => c.kind === type); const acct = ac >= 0 ? D.accounts.find(a => a.name.toLowerCase() === String(r[ac]).trim().toLowerCase()) : null;

      $('#csvPrev', m).innerHTML = `Ready to import <b>${rows.length}</b> transactions (${rows.filter(r => r.type === 'income').length} in, ${rows.filter(r => r.type === 'expense').length} out).`;
      $('#csvGo', m).disabled = !rows.length;
    };
    $('#csvGo', m).onclick = () => { rows.forEach(r => Store.upsert('tx', r, { silent: true })); Store.emit(false); API.audit('CSV_IMPORTED', 'Transactions', rows.length + ' rows'); m.close(); UI.toast(`${rows.length} transactions imported`); };

/* ---------- receipts: shrink photos so they fit in browser storage ---------- */
const Receipt = {
  read(file) {
    return new Promise((res, rej) => {
      const r = new FileReader(); r.onerror = () => rej(new Error('Could not read that file'));
      r.onload = () => {
        if (!/^image\//.test(file.type) || /svg/.test(file.type)) { if (file.size > 600 * 1024) return rej(new Error('That file is over 600 KB — attach a photo instead')); return res(r.result); }
        const img = new Image(); img.onerror = () => file.size > 600 * 1024 ? rej(new Error('That image is too large')) : res(r.result);
        img.onload = () => { const max = 1400, k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.72)); };
        img.src = r.result;
      };
      r.readAsDataURL(file);
    });
  },
};

const STATUS_CHIP = { paid: 'pos', 'part-paid': 'warn', overdue: 'neg', sent: '', draft: '', void: '', accepted: 'pos', declined: 'neg' };
const STATUS_LABEL = { paid: 'Paid', 'part-paid': 'Part-paid', overdue: 'Overdue', sent: 'Awaiting payment', draft: 'Draft', void: 'Void', accepted: 'Accepted', declined: 'Declined' };

/* ---------- small charts (hand-built SVG, hover tooltips) ---------- */
const Chart = {
  donut(segs, centre) {
    const R = 78, SW = 18, C = 2 * Math.PI * R, total = sum(segs, s => s.value), gap = segs.length > 1 ? 5 : 0;
    let off = 0;
    const arcs = total > 0 ? segs.map((s, i) => { const len = s.value / total * C; const d = Math.max(0.5, len - gap); const el = `<circle cx="100" cy="100" r="${R}" fill="none" stroke="${s.color}" stroke-width="${SW}" stroke-dasharray="${d} ${C - d}" stroke-dashoffset="${-off}" data-i="${i}" style="cursor:default"/>`; off += len; return el; }).join('')
      : `<circle cx="100" cy="100" r="${R}" fill="none" stroke="#ecedea" stroke-width="${SW}"/>`;
    return `<div class="donut-wrap"><svg viewBox="0 0 200 200" role="img" aria-label="Spending by category">${arcs}</svg><div class="donut-c">${centre}</div></div>`;
  },
  bindDonut(el, segs) { $$('circle[data-i]', el).forEach(c => { const s = segs[c.dataset.i]; c.onmousemove = e => UI.tip(e, `<b>${esc(s.label)}</b><br>${money(s.value)} · ${Math.round(s.share)}%`); c.onmouseleave = () => UI.tip(null); }); },
  bars(months, series, { h = 220 } = {}) {
    const W = 640, padL = 46, padB = 26, padT = 10, iw = W - padL - 8, ih = h - padB - padT;
    const max = Math.max(1, ...series.flatMap(s => s.values)); const step = (() => { const raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))); return Math.ceil(raw / mag) * mag; })(); const top = step * 4;
    const gw = iw / months.length, bw = Math.min(18, (gw - 10) / series.length - 2);
    let g = '';
    for (let k = 0; k <= 4; k++) { const y = padT + ih - ih * k / 4; g += `<line class="gridl" x1="${padL}" x2="${W - 8}" y1="${y}" y2="${y}"/><text x="${padL - 8}" y="${y + 4}" text-anchor="end">${Fmt.hidden ? '' : esc(money(step * k, { compact: true }))}</text>`; }
    months.forEach((m, i) => {
      const cx = padL + gw * i + gw / 2; const totalW = series.length * (bw + 2) - 2;
      series.forEach((s, j) => { const v = s.values[i]; const bh = Math.max(v > 0 ? 3 : 0, ih * v / top); const x = cx - totalW / 2 + j * (bw + 2), y = padT + ih - bh;
        g += `<path d="M${x},${padT + ih} V${y + Math.min(4, bh)} Q${x},${y} ${x + Math.min(4, bw / 2)},${y} H${x + bw - Math.min(4, bw / 2)} Q${x + bw},${y} ${x + bw},${y + Math.min(4, bh)} V${padT + ih} Z" fill="${s.color}"/>`; });
      g += `<rect x="${cx - gw / 2}" y="${padT}" width="${gw}" height="${ih}" fill="transparent" data-m="${i}"/><text x="${cx}" y="${h - 8}" text-anchor="middle">${esc(monthName(m, 'short'))}</text>`;
    });
    return `<svg class="chart" viewBox="0 0 ${W} ${h}" style="height:auto">${g}</svg>`;
  },
  bindBars(el, months, series) { $$('rect[data-m]', el).forEach(r => { const i = r.dataset.m; r.onmousemove = e => UI.tip(e, `<b>${esc(monthName(months[i]))}</b><br>` + series.map(s => `<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.color};margin-right:6px"></span>${esc(s.name)}: ${money(s.values[i])}`).join('<br>')); r.onmouseleave = () => UI.tip(null); }); },
  ring(p, { size = 64, color = 'var(--forest)', track = 'var(--chip)' } = {}) {
    const r = 26, C = 2 * Math.PI * r, d = Math.max(0, Math.min(100, p)) / 100 * C;
    return `<svg class="ring" viewBox="0 0 64 64" style="width:${size}px;height:${size}px"><circle cx="32" cy="32" r="${r}" fill="none" stroke="${track}" stroke-width="7"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${d} ${C}" transform="rotate(-90 32 32)"/><text x="32" y="36" text-anchor="middle" font-size="13" font-weight="500" fill="currentColor" font-family="inherit">${Math.round(p)}%</text></svg>`;
  },
};

/* ---------- reusable fragments ---------- */
const Frag = {
  txRow(t, { actions = false } = {}) {
    const isIn = t.type === 'income', c = Calc.cat(t.categoryId);
    const sub = t.status === 'pending' ? (t.date > today() ? 'Scheduled · ' + fmtDate(t.date) : 'Payment confirmation') : `${fmtDate(t.date)}${t.type === 'saving' ? ' · Savings' : ' · ' + esc(c.name)}`;
    return `<div class="tx ${t.status === 'pending' ? 'pending' : ''} ${actions ? '' : 'tx-click'}" data-tx="${esc(t.id)}">
      <div class="av" style="color:${isIn ? 'var(--pos)' : 'var(--ink)'}">${esc(initials(t.party))}</div>
      <div class="meta tx-click" data-edit="${esc(t.id)}"><b>${esc(t.party || c.name)}${t.status === 'pending' ? ' ' + money(t.amount) : ''}</b><small>${sub}</small></div>
      ${t.status === 'pending' ? `<div class="acts"><button class="ok-btn" data-ok="${esc(t.id)}" aria-label="Confirm payment" title="Confirm — money has moved">${I.check}</button><button class="x-btn" data-no="${esc(t.id)}" aria-label="Dismiss" title="Dismiss">${I.x}</button></div>`
        : `<div class="amt num ${isIn ? 'pos' : t.type === 'saving' ? '' : 'neg'}">${money(isIn ? t.amount : -t.amount, { sign: true })}</div>`}</div>`;
  },
  bindTx(root) {
    $$('[data-ok]', root).forEach(b => b.onclick = e => { e.stopPropagation(); const t = Store.get('tx', b.dataset.ok); t && Forms.confirmTx(t, true); });
    $$('[data-no]', root).forEach(b => b.onclick = e => { e.stopPropagation(); const t = Store.get('tx', b.dataset.no); t && Forms.confirmTx(t, false); });
    $$('[data-edit]', root).forEach(b => b.onclick = () => { const t = Store.get('tx', b.dataset.edit); t && Forms.tx({ tx: t }); });
  },
  empty(t, s, btn = '') { return `<div class="empty"><b>${esc(t)}</b>${esc(s)}${btn ? `<div style="margin-top:12px">${btn}</div>` : ''}</div>`; },
  stat(label, value, note = '', cls = '') { return `<div class="stat"><small>${esc(label)}</small><b class="num ${cls}">${value}</b>${note ? `<em class="muted">${note}</em>` : ''}</div>`; },
  progressBar(p, cls = '') { return `<div class="bar ${cls}"><span style="width:${Math.max(0, Math.min(100, p))}%"></span></div>`; },
};

const Views = {

  /* ================= OVERVIEW ================= */

    </div>

    <div class="grid g-3 section">
      <section class="card">
        <div class="card-h"><h3 class="card-t"><span class="badge-ic">${I.bag}</span>Spending</h3>
          <select class="pill-btn" id="spendMonth" aria-label="Month">${Calc.activeMonths().slice(0, 18).map(m => `<option value="${m}" ${m === sm ? 'selected' : ''}>${monthName(m)}</option>`).join('')}</select></div>
        <div id="donut">${Chart.donut(segs, `<b class="num">${money(sCur.expense)}</b><span class="small ${spendChange > 0 ? 'neg' : 'pos'}">${sPrev.expense ? pctFmt(spendChange) : ''}</span>`)}</div>
        <div class="insight">${insight ? `<span>${insight}</span>` : '<span class="muted">No spending recorded yet</span>'}</div>
        <div class="legend">${segs.map(s => `<div><i style="background:${s.color}"></i><span>${esc(s.label)}</span><em class="num">${money(s.value)}</em></div>`).join('')}${legendCats.map(c => `<div class="dim"><i style="background:#e3e5e0"></i><span>${esc(c.name)}</span><em>${money(0)}</em></div>`).join('')}</div>
      </section>

      <section class="card">
        <div class="card-h"><h3 class="card-t"><span class="badge-ic">${I.coins}</span>${biz ? 'Revenue' : 'Earning'}</h3>
          <div class="goal-chip tx-click" id="goalChip" title="Monthly target"><b class="num">${I.target} ${tg.target ? money(tg.target) : 'Set target'}</b><div class="goal-line"><span style="width:${tg.pct}%"></span></div></div></div>
        <div class="big num" style="font-size:36px">${money(cur.income)}</div>

        <div class="rows">${incRows.length ? incRows.map((r, i) => { const share = pct(r.v, cur.income); return `<div class="brow ${r.v ? '' : 'dim'}"><div class="top"><span>${esc(Calc.cat(r.id).name)}</span><span class="num">${money(r.v)}</span></div><div class="bar ${i === 0 && r.v ? 'hi' : ''}"><span style="width:${pct(r.v, maxInc)}%"></span>${i === 0 && r.v ? `<em class="pct" style="left:${Math.min(88, Math.max(12, pct(r.v, maxInc)))}%;font-style:normal">${Math.round(share)}%</em>` : ''}</div></div>`; }).join('') : Frag.empty('No income categories', 'Add one in Tools → Settings.')}</div>

        ${pendingList.concat(recent).length ? pendingList.concat(recent).map(t => Frag.txRow(t)).join('') : Frag.empty('Nothing recorded yet', 'Record your first payment — it shows up here instantly on every device.', `<button class="btn sm" id="firstTx">${I.plus} Record payment</button>`)}
